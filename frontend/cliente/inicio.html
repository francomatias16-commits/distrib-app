<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/cliente/manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <title>Inicio — Fluxo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css?v=196" />
  <link rel="stylesheet" href="/shared/skeletons.css?v=196" />
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <link rel="stylesheet" href="/shared/tienda-nav.css?v=1" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/cliente/pwa-init.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--color-bg); min-height: 100vh; }

    /* ── TOP BAR ── */
    .topbar {
      background: linear-gradient(135deg, var(--color-primary-dark) 0%, var(--color-primary) 100%);
      color: #fff; padding: 1.25rem 1.25rem .75rem;
    }
    .topbar-row { display: flex; justify-content: space-between; align-items: flex-start; }
    .topbar h1 { font-size: 1.1rem; font-weight: 700; }
    .topbar-sub { font-size: .8rem; opacity: .75; margin-top: .15rem; }
    .btn-logout {
      background: rgba(255,255,255,.15); color: #fff; border: none;
      border-radius: var(--radius-md); padding: .35rem .75rem; font-size: .78rem;
      cursor: pointer; font-family: inherit; white-space: nowrap;
    }

    /* ── NAV BOTTOM: ver /shared/tienda-nav.css ── */

    /* ── CONTENIDO ── */
    .contenido { padding: 1rem 1rem 5rem; max-width: 480px; margin: 0 auto; }

    /* ── BANNER BIENVENIDA ── */
    .banner-bienvenida {
      background: linear-gradient(135deg, var(--color-primary), var(--color-primary-dark));
      border-radius: var(--radius-xxl); padding: 1.25rem 1.25rem 1rem; color: #fff; margin-bottom: 1rem;
    }
    .banner-bienvenida h2 { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
    .banner-bienvenida p { font-size: .83rem; opacity: .85; }

    /* ── ACCESOS RÁPIDOS ── */
    .sección-titulo { font-size: .78rem; font-weight: 700; color: var(--color-text-muted); text-transform: uppercase; letter-spacing: .04em; margin: 1.25rem 0 .6rem; }
    .grid-accesos { display: grid; grid-template-columns: 1fr 1fr; gap: .65rem; }
    .card-acceso {
      background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: 0 1px 4px rgba(0,0,0,.07);
      padding: 1rem; display: flex; flex-direction: column; align-items: center;
      gap: .45rem; cursor: pointer; text-decoration: none; color: inherit;
      transition: transform .1s, box-shadow .1s;
    }
    .card-acceso:active { transform: scale(.97); }
    .card-acceso-icon {
      width: 44px; height: 44px; border-radius: var(--radius-xl);
      display: flex; align-items: center; justify-content: center;
    }
    .card-acceso-icon.azul { background: var(--color-primary-bg); color: var(--color-primary); }
    .card-acceso-icon.verde { background: var(--color-success-bg); color: var(--color-success-mid); }
    .card-acceso-icon.naranja { background: #fff3e8; }
    .card-acceso-icon.violeta { background: #f0ebfb; color: var(--nav-facturacion); }
    .card-acceso-label { font-size: .85rem; font-weight: 600; color: var(--color-text); }
    .card-acceso-sub { font-size: .72rem; color: var(--color-text-light); }

    /* ── PEDIDOS RECIENTES ── */
    .card-pedido {
      background: var(--color-surface); border-radius: var(--radius-xl); box-shadow: 0 1px 4px rgba(0,0,0,.07);
      padding: .9rem 1rem; margin-bottom: .5rem; display: flex; align-items: center; gap: .85rem;
    }
    .pedido-estado-dot { width: 10px; height: 10px; border-radius: 50%; flex-shrink: 0; }
    .dot-confirmado { background: var(--color-success-mid); }
    .dot-preparando { background: var(--color-warning-mid); }
    .dot-despachado { background: var(--color-info-mid); }
    .dot-entregado  { background: var(--color-text-muted); }
    .dot-borrador   { background: var(--color-border); }
    .dot-cancelado  { background: var(--color-danger-mid); }
    .pedido-info { flex: 1; min-width: 0; }
    .pedido-nro { font-size: .85rem; font-weight: 600; color: var(--color-text); }
    .pedido-fecha { font-size: .72rem; color: var(--color-text-light); margin-top: .1rem; }
    .pedido-total { font-size: .9rem; font-weight: 700; color: var(--color-primary); white-space: nowrap; }

    .empty-state { text-align: center; color: var(--color-text-light); padding: 2rem 1rem; font-size: .85rem; }
    .loading { text-align: center; color: var(--color-text-light); padding: 1.5rem; font-size: .85rem; }
  </style>
  <link rel="stylesheet" href="/frontend/shared/chat-widget.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-row">
      <div>
        <h1 id="saludoNombre">Mi cuenta</h1>
        <div class="topbar-sub" id="nombreEmpresa">Cargando...</div>
      </div>
      <button class="btn-logout" id="btnLogout">Salir</button>
    </div>
  </div>

  <div class="contenido">
    <div class="banner-bienvenida">
      <h2>¡Hola, <span id="bannerNombre">...</span>! <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M18 11V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v3"/><path d="M14 10V4a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v6"/><path d="M10 10.5V6a2 2 0 0 0-2-2v0a2 2 0 0 0-2 2v9"/><path d="M6 14l-1.5-1.5a1.4 1.4 0 0 0-2 2L7 19c1 1 2 2 4 2h3c3 0 5-2 5-5v-4"/></svg></h2>
      <p>Explorá el catálogo y hacé tu próximo pedido fácilmente.</p>
    </div>

    <div class="sección-titulo">Accesos rápidos</div>
    <div class="grid-accesos">
      <a class="card-acceso" href="/cliente/catalogo">
        <div class="card-acceso-icon azul">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/></svg>
        </div>
        <div class="card-acceso-label">Catálogo</div>
        <div class="card-acceso-sub">Ver productos</div>
      </a>
      <a class="card-acceso" href="/cliente/carrito">
        <div class="card-acceso-icon verde">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
        </div>
        <div class="card-acceso-label">Carrito</div>
        <div class="card-acceso-sub" id="subCarrito">Ver ítems</div>
      </a>
      <a class="card-acceso" href="/cliente/pedidos">
        <div class="card-acceso-icon naranja">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ea580c" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>
        </div>
        <div class="card-acceso-label">Mis pedidos</div>
        <div class="card-acceso-sub">Historial</div>
      </a>
      <a class="card-acceso" href="/cliente/cuenta">
        <div class="card-acceso-icon violeta">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
        </div>
        <div class="card-acceso-label">Mi cuenta</div>
        <div class="card-acceso-sub">Perfil y puntos</div>
      </a>
    </div>

    <div class="sección-titulo">Últimos pedidos</div>
    <div id="listaPedidos"><div class="loading">Cargando...</div></div>
  </div>

  <!-- NAV BOTTOM -->
  <nav class="nav-bottom">
    <a class="nav-item activo" href="/cliente/inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Inicio
    </a>
    <a class="nav-item" href="/cliente/catalogo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/></svg>
      Catálogo
    </a>
    <a class="nav-item" href="/cliente/carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      <span id="navBadgeCarrito" class="badge" style="display:none">0</span>
      Carrito
    </a>
    <a class="nav-item" href="/cliente/pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Pedidos
    </a>
    <a class="nav-item" href="/cliente/cuenta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Cuenta
    </a>
  </nav>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-cliente-auth' } });

    const ESTADOS = {
      borrador: { label: 'Borrador', cls: 'dot-borrador' },
      confirmado: { label: 'Confirmado', cls: 'dot-confirmado' },
      preparando: { label: 'Preparando', cls: 'dot-preparando' },
      despachado: { label: 'Despachado', cls: 'dot-despachado' },
      entregado: { label: 'Entregado', cls: 'dot-entregado' },
      cancelado: { label: 'Cancelado', cls: 'dot-cancelado' },
    };

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '/cliente/login'; return; }

      // Obtener perfil del usuario
      const { data: usuario } = await sb.from('usuarios')
        .select('nombre, empresa_id, cliente_id')
        .eq('id', session.user.id)
        .single();

      if (!usuario?.cliente_id) { window.location.href = '/cliente/login'; return; }

      const nombreCorto = (usuario.nombre || 'Cliente').split(' ')[0];
      document.getElementById('saludoNombre').textContent = usuario.nombre || 'Cliente';
      document.getElementById('bannerNombre').textContent = nombreCorto;

      // Empresa
      const { data: empresa } = await sb.from('empresas')
        .select('nombre').eq('id', usuario.empresa_id).single();
      document.getElementById('nombreEmpresa').textContent = empresa?.nombre || '';

      // Carrito — contar ítems
      const { data: carrito } = await sb.from('carrito_items')
        .select('id').eq('cliente_id', usuario.cliente_id);
      const nCarrito = carrito?.length || 0;
      if (nCarrito > 0) {
        document.getElementById('subCarrito').textContent = `${nCarrito} ítem${nCarrito > 1 ? 's' : ''}`;
        const badge = document.getElementById('navBadgeCarrito');
        badge.textContent = nCarrito > 9 ? '9+' : nCarrito;
        badge.style.display = 'block';
      }

      // Pedidos recientes
      const { data: pedidos } = await sb.from('pedidos')
        .select('id, numero_pedido, estado, total, fecha_pedido')
        .eq('cliente_id', usuario.cliente_id)
        .neq('estado', 'borrador')
        .order('fecha_pedido', { ascending: false })
        .limit(5);

      const cont = document.getElementById('listaPedidos');
      if (!pedidos?.length) {
        cont.innerHTML = '<div class="empty-state">Todavía no tenés pedidos. ¡Empezá desde el catálogo!</div>';
        return;
      }
      cont.innerHTML = pedidos.map(p => {
        const est = ESTADOS[p.estado] || { label: p.estado, cls: 'dot-borrador' };
        const fecha = new Date(p.fecha_pedido).toLocaleDateString('es-AR', { day: '2-digit', month: 'short', year: 'numeric' });
        return `
          <div class="card-pedido" onclick="window.location.href='/cliente/pedidos'">
            <div class="pedido-estado-dot ${est.cls}"></div>
            <div class="pedido-info">
              <div class="pedido-nro">${esc(p.numero_pedido || 'Pedido')}</div>
              <div class="pedido-fecha">${est.label} · ${fecha}</div>
            </div>
            <div class="pedido-total">${formatPeso(p.total)}</div>
          </div>`;
      }).join('');
    });

    document.getElementById('btnLogout').addEventListener('click', async () => {
      await sb.auth.signOut();
      window.location.href = '/cliente/login';
    });

    function formatPeso(n) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(n) || 0);
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
  <script src="/frontend/shared/chat-widget.js" defer data-chat-asistente="1"></script>
</body>
</html>
