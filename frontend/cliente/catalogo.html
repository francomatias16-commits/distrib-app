<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/cliente/manifest.json" />
  <meta name="theme-color" content="#19372D" />
  <title>Catálogo — Fluxo</title>
  <link rel="stylesheet" href="/shared/tokens.css?v=197" />
  <link rel="stylesheet" href="/shared/skeletons.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <link rel="stylesheet" href="/shared/tienda-nav.css?v=2" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/cliente/pwa-init.js"></script>
  <link rel="stylesheet" href="/cliente/css/catalogo.css?v=3" />
  <link rel="stylesheet" href="/frontend/shared/chat-widget.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-header-row">
      <div class="topbar-logo-catalogo" id="catalogoLogo" hidden></div>
      <div>
        <h1>Catálogo</h1>
        <p>Productos disponibles para tu próximo pedido</p>
      </div>
    </div>

    <div class="buscador-wrap">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input type="text" id="inputBuscar" aria-label="Buscar producto" placeholder="Buscar producto...">
    </div>

    <div class="categorias-scroll" id="categoriasScroll"></div>
  </div>

  <!-- FIX v477: banner de vista previa — se muestra solo cuando "Ver catálogo"
       del panel admin abrió esta página con un preview_token (ver catalogo.html
       más abajo). Aclara que esto no es la vista de un cliente real logueado,
       aunque los datos (precios, stock, categorías) sean exactamente los mismos. -->
  <div id="bannerPreviewAdmin" style="display:none;background:var(--color-warning-bg);color:var(--color-warning);font-size:13px;font-weight:600;text-align:center;padding:8px 12px;">
    Vista previa — así ve el catálogo un cliente de tu empresa
  </div>

  <!-- Sección fija de destacados (productos.destacado, migración 527/529):
       fetch propio con ?destacados=1, independiente de categoría/búsqueda/
       paginación del resto del catálogo. Se oculta si la empresa no tiene
       ningún producto marcado como destacado. -->
  <div class="seccion-destacados" id="seccionDestacados" style="display:none">
    <div class="seccion-destacados-titulo">Destacados</div>
    <div class="seccion-destacados-scroll" id="destacadosScroll"></div>
  </div>

  <!-- Combos (migración 530/531): mismo patrón de sección fija que
       Destacados — fetch propio vía cliente_combos_disponibles, no
       comparte paginación/filtros con el listado principal de productos.
       Se oculta si la empresa no tiene ningún combo activo con stock. -->
  <div class="seccion-destacados" id="seccionCombos" style="display:none">
    <div class="seccion-destacados-titulo">Combos</div>
    <div class="seccion-destacados-scroll" id="combosScroll"></div>
  </div>

  <div class="filtro-bar">
    <button type="button" class="filtro-bar-toggle" id="btnSoloOfertas" aria-pressed="false">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20.59 13.41L11 3.83A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .83 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1"/></svg>
      Solo ofertas
    </button>
    <span class="filtro-bar-count" id="filtroBarCount">0 productos</span>
    <div class="filtro-bar-orden">
      <select id="selectOrden" aria-label="Ordenar productos">
        <option value="relevancia">Destacados</option>
        <option value="precio_asc">Precio: menor a mayor</option>
        <option value="precio_desc">Precio: mayor a menor</option>
        <option value="nombre_asc">Nombre A-Z</option>
        <option value="ofertas_primero">Ofertas primero</option>
      </select>
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
    </div>
  </div>

  <div class="contenido">
    <div id="listaProductos"><div class="loading">Cargando catálogo...</div></div>
  </div>

  <div id="toastCarrito">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M20 6 9 17l-5-5"/></svg>
    <span id="toastTexto">Agregado al carrito</span>
  </div>

  <!-- Barra inferior: ir al carrito -->
  <div class="bar-confirmar" id="barConfirmar">
    <div>
      <div class="bar-confirmar-info" id="barItems">0 productos</div>
      <div class="bar-confirmar-total" id="barTotal">$ 0</div>
    </div>
    <button class="bar-confirmar-btn" onclick="window.location.href='/cliente/carrito'">
      Ver carrito →
    </button>
  </div>

  <nav class="nav-bottom">
    <a class="nav-item" href="/cliente/inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Inicio
    </a>
    <a class="nav-item activo" href="/cliente/catalogo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/></svg>
      Catálogo
    </a>
    <a class="nav-item" href="/cliente/carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Carrito
    </a>
    <a class="nav-item" href="/cliente/pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Pedidos
    </a>
    <a class="nav-item" href="/cliente/cuenta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Cuenta
    </a>
  </nav>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-cliente-auth' } });
    const params = new URLSearchParams(window.location.search);

    let empresaId = params.get('empresa_id');
    // 501: link corto y legible del catálogo (/cliente/catalogo?e=<slug>),
    // alternativa a pasar el UUID crudo — se resuelve a empresaId más abajo,
    // antes de cargar nada, así el resto del archivo sigue usando empresaId
    // sin ningún otro cambio.
    const empresaSlug = params.get('e');
    let categoriaActiva = null;
    let busquedaActual = '';
    let paginaActual = 1;
    let totalPaginas = 1;
    let cargando = false;
    let debounceTimer = null;

    let clienteId = null;       // null si no hay sesión de cliente (catálogo público / sin login)
    let accessToken = null;     // JWT de la sesión, si hay una — se manda al backend en Authorization
    const carritoMap = new Map(); // producto_id -> cantidad (refleja lo que ya está en carrito_items)
    const comboCarritoMap = new Map(); // combo_id -> cantidad (mismo criterio, para renglones de combo)
    let combosCargados = []; // combos ya traídos de cliente_combos_disponibles, para pintarCardCombo/stepper

    // Filtro/orden estilo "shop all" (client-side, sobre lo ya cargado por
    // paginación): no requiere tocar el backend — se reordena/filtra lo que
    // ya llegó del server, y sigue sumando lo que trae "Ver más productos".
    let productosCargados = [];  // acumula todos los productos traídos hasta ahora
    let ordenActual = 'relevancia';
    let soloOfertas = false;

    // FIX v477 — "Ver catálogo" (panel admin): el link llega con el access
    // token del admin en el fragmento de la URL (#preview_token=...), nunca
    // en el query string, para que no quede en logs del servidor ni en el
    // header Referer. Se lee acá, se limpia la URL de inmediato (para que no
    // quede visible/copiable en la barra ni en el historial del navegador),
    // y se usa tal cual como sesión — el backend lo valida como el token de
    // un usuario real y autenticado de la empresa (ver resolverEmpresaCliente
    // en lib/handlers/stock.js), sin depender del flag de catálogo público.
    let previewToken = null;
    if (window.location.hash.startsWith('#preview_token=')) {
      previewToken = decodeURIComponent(window.location.hash.slice('#preview_token='.length));
      history.replaceState(null, '', window.location.pathname + window.location.search);
    }

    function headersAuth() {
      return accessToken ? { Authorization: `Bearer ${accessToken}` } : {};
    }

    document.addEventListener('DOMContentLoaded', async () => {
      if (previewToken) {
        // Vista previa desde el panel admin: usamos el token del admin tal
        // cual, sin intentar resolver un perfil de "cliente" (el admin no
        // tiene cliente_id — no es un cliente real, y no debería serlo).
        accessToken = previewToken;
        document.getElementById('bannerPreviewAdmin').style.display = '';
      } else {
        // Si hay sesión de cliente, resolver empresa_id y cliente_id desde su perfil
        const { data: { session } } = await sb.auth.getSession();
        if (session) {
          accessToken = session.access_token;
          const { data: perfil } = await sb.from('usuarios').select('empresa_id, cliente_id').eq('id', session.user.id).single();
          if (perfil?.empresa_id) {
            if (!empresaId) empresaId = perfil.empresa_id;
            clienteId = perfil.cliente_id || null;
          }
        }
      }

      // 501: si no vino empresa_id pero sí el slug corto (?e=), se resuelve
      // acá — mismo gateo (catalogo_publico_habilitado) que empresa_publica_por_id,
      // así que si falla (slug inexistente o catálogo no habilitado) simplemente
      // no se completa empresaId y cae en el mensaje de abajo, igual que hoy
      // pasa con un empresa_id inválido.
      if (!empresaId && empresaSlug) {
        try {
          const { data } = await sb.rpc('empresa_publica_por_slug', { p_slug: empresaSlug });
          if (data && data[0]) empresaId = data[0].id;
        } catch (e) { /* cae al mensaje de "no se especificó la empresa" */ }
      }

      if (!empresaId) {
        document.getElementById('listaProductos').innerHTML = `
          <div class="empty-state">No se especificó la empresa. Accedé desde el link que te compartió tu distribuidora.</div>`;
        return;
      }

      if (clienteId) await cargarCarritoActual();

      cargarLogoEmpresa();
      await cargarCategorias();
      await cargarProductos(true);
      cargarDestacados(); // independiente del listado principal, no bloquea su carga
      cargarCombos();     // ídem — sección fija propia
    });

    // Combos (531/cliente_combos_disponibles): mismo criterio que
    // cargarDestacados — fetch propio, no bloquea el catálogo principal si
    // falla, y queda oculta si la empresa no tiene combos disponibles.
    async function cargarCombos() {
      try {
        const { data, error } = await sb.rpc('cliente_combos_disponibles', {
          p_empresa_id: empresaId, p_limit: 12, p_offset: 0,
        });
        if (error) throw error;

        combosCargados = data || [];
        const sec = document.getElementById('seccionCombos');
        const scroll = document.getElementById('combosScroll');
        if (!combosCargados.length) { sec.style.display = 'none'; return; }

        scroll.innerHTML = combosCargados.map(pintarCardCombo).join('');
        sec.style.display = '';
      } catch (e) {
        console.error('[catalogo] No se pudieron cargar los combos:', e.message);
      }
    }

    // Sección fija de destacados: fetch propio (?destacados=1), no comparte
    // paginación ni filtros de categoría/búsqueda con el listado principal.
    // Si no hay ningún producto destacado, la sección queda oculta.
    async function cargarDestacados() {
      try {
        const qs = new URLSearchParams({ empresa_id: empresaId, destacados: '1', limit: 10 });
        const r = await fetch(`/api/cliente/productos?${qs.toString()}`, { headers: headersAuth() });
        const data = await r.json();
        if (!r.ok) return;

        const destacados = data.productos || [];
        const sec = document.getElementById('seccionDestacados');
        const scroll = document.getElementById('destacadosScroll');
        if (!destacados.length) { sec.style.display = 'none'; return; }

        scroll.innerHTML = destacados.map(p => pintarCardProducto(p)).join('');
        sec.style.display = '';
      } catch (e) {
        // La sección fija es un complemento — si falla, el catálogo
        // principal sigue funcionando igual, no se muestra error.
        console.error('[catalogo] No se pudieron cargar los destacados:', e.message);
      }
    }

    // v744 — logo de la empresa en el header del catálogo público. Falla en
    // silencio (deja el logo oculto) si el RPC no devuelve fila: pasa si la
    // empresa no habilitó catalogo_publico_habilitado (ver 475), o si el
    // cliente logueado todavía no tiene sesión resuelta contra RLS — en
    // ningún caso debe romper la carga del catálogo en sí.
    async function cargarLogoEmpresa() {
      try {
        const { data, error } = await sb.rpc('empresa_publica_por_id', { p_empresa_id: empresaId });
        if (error || !data || !data[0]) return;

        const empresa = data[0];
        const el = document.getElementById('catalogoLogo');
        if (!el) return;

        if (empresa.logo_url) {
          const img = document.createElement('img');
          img.src = empresa.logo_url;
          img.alt = empresa.nombre || 'Logo de la empresa';
          img.onerror = () => {
            el.innerHTML = '';
            el.textContent = empresa.nombre?.charAt(0)?.toUpperCase() || '';
          };
          el.innerHTML = '';
          el.appendChild(img);
        } else if (empresa.nombre) {
          el.textContent = empresa.nombre.charAt(0).toUpperCase();
        } else {
          return; // sin logo ni nombre: no hay nada útil que mostrar
        }
        el.hidden = false;
      } catch {
        // sin conexión / RPC no disponible: el catálogo sigue funcionando sin logo
      }
    }

    async function cargarCarritoActual() {
      try {
        const { data } = await sb.rpc('get_carrito_cliente', { p_cliente_id: clienteId });
        carritoMap.clear();
        comboCarritoMap.clear();
        (data || []).forEach(it => {
          if (it.combo_id) comboCarritoMap.set(it.combo_id, it.cantidad);
          else carritoMap.set(it.producto_id, it.cantidad);
        });
        actualizarFab();
      } catch (e) {
        // si falla, el catálogo sigue mostrando productos sin estado de carrito
      }
    }

    function actualizarFab() {
      const cantidades = [...carritoMap.values(), ...comboCarritoMap.values()];
      const totalItems = cantidades.reduce((a, b) => a + b, 0);
      const bar = document.getElementById('barConfirmar');

      if (totalItems > 0) {
        // Calcular total aproximado (suma de precio * cantidad desde carritoMap no tiene precios)
        // Usar el total que ya calculamos al agregar
        const plural = totalItems === 1 ? '1 producto' : `${totalItems} productos`;
        document.getElementById('barItems').textContent = plural;
        bar.classList.add('visible');
      } else {
        bar.classList.remove('visible');
      }
    }

    function mostrarToast(texto) {
      const t = document.getElementById('toastCarrito');
      document.getElementById('toastTexto').textContent = texto;
      t.classList.add('visible');
      clearTimeout(t._timer);
      t._timer = setTimeout(() => t.classList.remove('visible'), 1800);
    }

    document.getElementById('inputBuscar').addEventListener('input', (e) => {
      clearTimeout(debounceTimer);
      debounceTimer = setTimeout(() => {
        busquedaActual = e.target.value.trim();
        cargarProductos(true);
      }, 350);
    });

    document.getElementById('selectOrden').addEventListener('change', (e) => {
      ordenActual = e.target.value;
      renderGrid();
    });

    document.getElementById('btnSoloOfertas').addEventListener('click', (e) => {
      soloOfertas = !soloOfertas;
      e.currentTarget.setAttribute('aria-pressed', String(soloOfertas));
      renderGrid();
    });

    async function cargarCategorias() {
      try {
        const r = await fetch(`/api/cliente/categorias?empresa_id=${empresaId}`, { headers: headersAuth() });
        const data = await r.json();
        if (!r.ok) return;

        const cont = document.getElementById('categoriasScroll');
        const categorias = data.categorias || [];
        if (!categorias.length) { cont.style.display = 'none'; return; }

        cont.innerHTML = `<button type="button" class="chip-cat activa" aria-pressed="true"  data-id="">Todas</button>` +
          categorias.map(c => `<button type="button" class="chip-cat" aria-pressed="false" data-id="${c.id}">${esc(c.nombre)}</button>`).join('');

        cont.querySelectorAll('.chip-cat').forEach(btn => {
          btn.addEventListener('click', () => {
            cont.querySelectorAll('.chip-cat').forEach(b => { b.classList.remove('activa'); b.setAttribute('aria-pressed', 'false'); });
            btn.classList.add('activa'); btn.setAttribute('aria-pressed', 'true');
            categoriaActiva = btn.dataset.id || null;
            cargarProductos(true);
          });
        });
      } catch (e) {
        // Si falla categorías, el catálogo igual funciona sin filtro
      }
    }

    async function cargarProductos(reset) {
      if (cargando) return;
      cargando = true;

      if (reset) {
        paginaActual = 1;
        productosCargados = [];
        document.getElementById('listaProductos').innerHTML = '<div class="loading">Cargando catálogo...</div>';
      }

      try {
        const qs = new URLSearchParams({ empresa_id: empresaId, page: paginaActual, limit: 24 });
        if (categoriaActiva) qs.set('categoria', categoriaActiva);
        if (busquedaActual)  qs.set('q', busquedaActual);

        const r = await fetch(`/api/cliente/productos?${qs.toString()}`, { headers: headersAuth() });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al cargar productos');

        totalPaginas = data.pages || 1;
        const productos = data.productos || [];

        if (reset && !productos.length) {
          document.getElementById('listaProductos').innerHTML = `
            <div class="empty-state">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
                <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
              </svg>
              <div>No encontramos productos con ese criterio.</div>
            </div>`;
          document.getElementById('filtroBarCount').textContent = '0 productos';
          return;
        }

        productosCargados = productosCargados.concat(productos);
        renderGrid();
      } catch (e) {
        document.getElementById('listaProductos').innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
      } finally {
        cargando = false;
      }
    }

    // Aplica orden + filtro "solo ofertas" sobre lo ya cargado, y repinta la
    // grilla entera. No dispara ningún fetch: es instantáneo, como el sort
    // de un listado ya traído a memoria.
    function renderGrid() {
      let lista = productosCargados.slice();

      if (soloOfertas) lista = lista.filter(p => !!p.oferta_liquidacion);

      const precioDe = p => +(p.oferta_liquidacion ? p.oferta_liquidacion.precio_oferta : p.precio_base) || 0;
      if (ordenActual === 'precio_asc') {
        lista.sort((a, b) => precioDe(a) - precioDe(b));
      } else if (ordenActual === 'precio_desc') {
        lista.sort((a, b) => precioDe(b) - precioDe(a));
      } else if (ordenActual === 'nombre_asc') {
        lista.sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es'));
      } else if (ordenActual === 'ofertas_primero') {
        lista.sort((a, b) => (b.oferta_liquidacion ? 1 : 0) - (a.oferta_liquidacion ? 1 : 0));
      }

      const cont = document.getElementById('listaProductos');
      const countEl = document.getElementById('filtroBarCount');

      if (!lista.length) {
        cont.innerHTML = `
          <div class="empty-state">
            <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
              <path d="M20.59 13.41L11 3.83A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .83 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1"/>
            </svg>
            <div>No hay productos en oferta en este momento.</div>
          </div>`;
        countEl.textContent = '0 productos';
        return;
      }

      cont.innerHTML = `<div class="grid-productos" id="gridProductos">${lista.map(pintarCardProducto).join('')}</div>`;
      const plural = lista.length === 1 ? '1 producto' : `${lista.length} productos`;
      countEl.textContent = totalPaginas > paginaActual ? `${plural}+` : plural;
      renderBotonCargarMas();
    }

    function renderBotonCargarMas() {
      const existente = document.getElementById('btnCargarMas');
      if (existente) existente.remove();

      if (paginaActual >= totalPaginas) return;

      const btn = document.createElement('button');
      btn.id = 'btnCargarMas';
      btn.className = 'btn-cargar-mas';
      btn.textContent = 'Ver más productos';
      btn.addEventListener('click', async () => {
        btn.disabled = true; btn.textContent = 'Cargando...';
        paginaActual += 1;
        await cargarProductos(false);
      });
      document.getElementById('listaProductos').appendChild(btn);
    }

    // Texto teaser de regla de volumen ("Desde 6 un.: 5% off" / "Desde 6 un.: $450 c/u").
    // No es el precio que se cobra (eso se recalcula real al armar el carrito);
    // es solo un incentivo informativo. Se oculta si ya hay una oferta de
    // liquidación activa, para no saturar la card con dos mensajes de precio.
    function textoReglaVolumen(p) {
      const r = p.regla_volumen;
      if (!r || p.oferta_liquidacion) return '';
      const cant = r.cantidad_minima;
      const detalle = r.tipo_descuento === 'porcentaje'
        ? `${Math.round(r.valor)}% off`
        : `${formatPeso(r.valor)} c/u`;
      return `<div class="teaser-volumen">Desde ${cant} un.: ${esc(detalle)}</div>`;
    }

    function pintarCardProducto(p) {
      const oferta = p.oferta_liquidacion;
      const sinStock = (p.stock_disponible || 0) <= 0;

      const precioBase = +p.precio_base || 0;
      const precioFinal = oferta ? +oferta.precio_oferta : precioBase;

      let venceTexto = '';
      if (oferta?.vence_oferta_at) {
        const dias = Math.max(0, Math.ceil((new Date(oferta.vence_oferta_at) - new Date()) / 86400000));
        venceTexto = dias <= 0 ? 'Vence hoy' : `Vence en ${dias} día${dias === 1 ? '' : 's'}`;
      }

      return `
        <div class="card-producto" data-producto-id="${p.id}">
          ${sinStock ? `<div class="sin-stock-overlay"><span class="sin-stock-tag">Sin stock</span></div>` : ''}
          ${oferta ? `<div class="badge-oferta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M20.59 13.41L11 3.83A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .83 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1"/></svg>-${Math.round(oferta.descuento_pct)}%</div>` : ''}
          <div class="producto-img-wrap" onclick="abrirZoomProducto('${p.id}')">
            ${p.foto_url
              ? `<img src="${esc(p.foto_url)}" alt="${esc(p.nombre)}" loading="lazy">`
              : `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/><path d="M9 11v3M15 11v3"/></svg>`}
          </div>
          <div class="producto-body">
            <div class="producto-nombre">${esc(p.nombre)}</div>
            <div class="producto-unidad">${esc(p.unidad || '')}</div>
            <div class="producto-precios">
              ${oferta ? `<div class="precio-tachado">${formatPeso(precioBase)}</div>` : ''}
              <div class="precio-actual ${oferta ? 'con-oferta' : ''}">${formatPeso(precioFinal)}</div>
              ${venceTexto ? `<div class="vence-oferta">⏱ ${esc(venceTexto)}</div>` : ''}
              ${textoReglaVolumen(p)}
            </div>
            <div class="producto-accion" id="accion-${p.id}">
              ${renderAccionHtml(p.id, sinStock, precioFinal)}
            </div>
          </div>
        </div>`;
    }

    function abrirZoomProducto(productoId) {
      const p = productosCargados.find(x => String(x.id) === String(productoId));
      if (!p) return;

      const oferta = p.oferta_liquidacion;
      const sinStock = (p.stock_disponible || 0) <= 0;
      const precioBase = +p.precio_base || 0;
      const precioFinal = oferta ? +oferta.precio_oferta : precioBase;

      let venceTexto = '';
      if (oferta?.vence_oferta_at) {
        const dias = Math.max(0, Math.ceil((new Date(oferta.vence_oferta_at) - new Date()) / 86400000));
        venceTexto = dias <= 0 ? 'Vence hoy' : `Vence en ${dias} día${dias === 1 ? '' : 's'}`;
      }

      let overlay = document.getElementById('zoomOverlay');
      if (!overlay) {
        overlay = document.createElement('div');
        overlay.id = 'zoomOverlay';
        overlay.className = 'zoom-overlay';
        overlay.addEventListener('click', (e) => { if (e.target === overlay) cerrarZoomProducto(); });
        document.body.appendChild(overlay);
      }

      overlay.innerHTML = `
        <div class="zoom-panel">
          <button type="button" class="zoom-cerrar" onclick="cerrarZoomProducto()" aria-label="Cerrar">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18M6 6l12 12"/></svg>
          </button>
          ${sinStock ? `<div class="sin-stock-overlay" style="border-radius:var(--radius-xxl) var(--radius-xxl) 0 0;"><span class="sin-stock-tag">Sin stock</span></div>` : ''}
          ${oferta ? `<div class="badge-oferta"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M20.59 13.41L11 3.83A2 2 0 0 0 9.6 3H4a1 1 0 0 0-1 1v5.6a2 2 0 0 0 .83 1.41l9.58 9.58a2 2 0 0 0 2.83 0l4.35-4.35a2 2 0 0 0 0-2.83z"/><circle cx="7.5" cy="7.5" r="1"/></svg>-${Math.round(oferta.descuento_pct)}%</div>` : ''}
          <div class="zoom-img-wrap">
            ${p.foto_url
              ? `<img src="${esc(p.foto_url)}" alt="${esc(p.nombre)}">`
              : `<svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/><path d="M9 11v3M15 11v3"/></svg>`}
          </div>
          <div class="zoom-body">
            <div class="zoom-nombre">${esc(p.nombre)}</div>
            <div class="zoom-unidad">${esc(p.unidad || '')}</div>
            ${p.descripcion ? `<div class="zoom-descripcion">${esc(p.descripcion)}</div>` : ''}
            <div class="zoom-precios producto-precios">
              ${oferta ? `<div class="precio-tachado">${formatPeso(precioBase)}</div>` : ''}
              <div class="precio-actual ${oferta ? 'con-oferta' : ''}">${formatPeso(precioFinal)}</div>
              ${venceTexto ? `<div class="vence-oferta">⏱ ${esc(venceTexto)}</div>` : ''}
              ${textoReglaVolumen(p)}
            </div>
            <div class="producto-accion" id="accion-modal-${p.id}">
              ${renderAccionHtml(p.id, sinStock, precioFinal)}
            </div>
          </div>
        </div>`;

      requestAnimationFrame(() => overlay.classList.add('abierto'));
      document.body.style.overflow = 'hidden';
    }

    function cerrarZoomProducto() {
      const overlay = document.getElementById('zoomOverlay');
      if (!overlay) return;
      overlay.classList.remove('abierto');
      document.body.style.overflow = '';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') cerrarZoomProducto();
    });

    function renderAccionHtml(productoId, sinStock, precioFinal) {
      if (sinStock) {
        return `<button class="btn-agregar" disabled>Sin stock</button>`;
      }
      const cantidadEnCarrito = carritoMap.get(productoId) || 0;
      if (cantidadEnCarrito > 0) {
        return `
          <div class="qty-stepper">
            <button type="button" onclick="cambiarCantidadCatalogo('${productoId}', ${precioFinal}, -1)">−</button>
            <span class="qty-val">${cantidadEnCarrito}</span>
            <button type="button" onclick="cambiarCantidadCatalogo('${productoId}', ${precioFinal}, 1)">+</button>
          </div>`;
      }
      return `<button class="btn-agregar" onclick="agregarAlCarrito('${productoId}', ${precioFinal})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Agregar
      </button>`;
    }

    function refrescarAccionCard(productoId, precioFinal) {
      const cont = document.getElementById(`accion-${productoId}`);
      if (cont) cont.innerHTML = renderAccionHtml(productoId, false, precioFinal);
      const contModal = document.getElementById(`accion-modal-${productoId}`);
      if (contModal) contModal.innerHTML = renderAccionHtml(productoId, false, precioFinal);
    }

    // Composición del combo como texto teaser corto, ej. "2x Coca 1.5L + 1x Papas 500g".
    function textoComposicionCombo(items) {
      if (!items?.length) return '';
      return items.map(it => `${it.cantidad}x ${esc(it.nombre)}`).join(' + ');
    }

    function pintarCardCombo(c) {
      return `
        <div class="card-producto" data-combo-id="${c.id}">
          <div class="producto-img-wrap">
            ${c.foto_url
              ? `<img src="${esc(c.foto_url)}" alt="${esc(c.nombre)}" loading="lazy">`
              : `<svg width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/><path d="M9 11v3M15 11v3"/></svg>`}
          </div>
          <div class="producto-body">
            <div class="producto-nombre">${esc(c.nombre)} <span class="badge-combo">Combo</span></div>
            <div class="producto-unidad">${textoComposicionCombo(c.items)}</div>
            <div class="producto-precios">
              <div class="precio-actual">${formatPeso(c.precio)}</div>
            </div>
            <div class="producto-accion" id="accion-combo-${c.id}">
              ${renderAccionComboHtml(c.id, +c.precio)}
            </div>
          </div>
        </div>`;
    }

    function renderAccionComboHtml(comboId, precio) {
      const cantidadEnCarrito = comboCarritoMap.get(comboId) || 0;
      if (cantidadEnCarrito > 0) {
        return `
          <div class="qty-stepper">
            <button type="button" onclick="cambiarCantidadCombo('${comboId}', ${precio}, -1)">−</button>
            <span class="qty-val">${cantidadEnCarrito}</span>
            <button type="button" onclick="cambiarCantidadCombo('${comboId}', ${precio}, 1)">+</button>
          </div>`;
      }
      return `<button class="btn-agregar" onclick="agregarComboAlCarrito('${comboId}', ${precio})">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.5"><path d="M12 5v14M5 12h14"/></svg>
        Agregar
      </button>`;
    }

    function refrescarAccionCombo(comboId, precio) {
      const cont = document.getElementById(`accion-combo-${comboId}`);
      if (cont) cont.innerHTML = renderAccionComboHtml(comboId, precio);
    }

    async function agregarComboAlCarrito(comboId, precio) {
      if (!clienteId) {
        window.location.href = `/cliente/login`;
        return;
      }
      const cont = document.getElementById(`accion-combo-${comboId}`);
      const btn = cont?.querySelector('.btn-agregar');
      if (btn) { btn.disabled = true; btn.textContent = 'Agregando...'; }

      try {
        const { error } = await sb.from('carrito_items')
          .upsert({
            empresa_id: empresaId,
            cliente_id: clienteId,
            combo_id: comboId,
            cantidad: (comboCarritoMap.get(comboId) || 0) + 1,
            precio_snap: precio,
            updated_at: new Date().toISOString(),
          }, { onConflict: 'cliente_id,combo_id' });

        if (error) throw error;

        comboCarritoMap.set(comboId, (comboCarritoMap.get(comboId) || 0) + 1);
        refrescarAccionCombo(comboId, precio);
        actualizarFab();
        mostrarToast('Agregado al carrito');
      } catch (e) {
        mostrarToast('No se pudo agregar. Probá de nuevo.');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Agregar'; }
      }
    }

    async function cambiarCantidadCombo(comboId, precio, delta) {
      const procesoKey = `combo:${comboId}`;
      if (productosEnProceso.has(procesoKey)) return;
      productosEnProceso.add(procesoKey);
      const actual = comboCarritoMap.get(comboId) || 0;
      const nueva = actual + delta;

      try {
        if (nueva <= 0) {
          const { error } = await sb.from('carrito_items')
            .delete().eq('cliente_id', clienteId).eq('combo_id', comboId);
          if (error) throw error;
          comboCarritoMap.delete(comboId);
        } else {
          const { error } = await sb.from('carrito_items')
            .upsert({
              empresa_id: empresaId,
              cliente_id: clienteId,
              combo_id:   comboId,
              cantidad:   nueva,
              precio_snap: precio,
              updated_at: new Date().toISOString(),
            }, { onConflict: 'cliente_id,combo_id' });
          if (error) throw error;
          comboCarritoMap.set(comboId, nueva);
        }
        refrescarAccionCombo(comboId, precio);
        actualizarFab();
      } catch (e) {
        console.error('[carrito] error update combo:', e);
        mostrarToast('No se pudo actualizar el carrito.');
      } finally {
        productosEnProceso.delete(procesoKey);
      }
    }

    async function agregarAlCarrito(productoId, precioFinal) {
      if (!clienteId) {
        window.location.href = `/cliente/login`;
        return;
      }

      const cont = document.getElementById(`accion-${productoId}`);
      const btn = cont?.querySelector('.btn-agregar');
      if (btn) { btn.disabled = true; btn.textContent = 'Agregando...'; }

      try {
        const { error } = await sb.from('carrito_items')
          .upsert({
            empresa_id: empresaId,
            cliente_id: clienteId,
            producto_id: productoId,
            cantidad: (carritoMap.get(productoId) || 0) + 1,
            precio_snap: precioFinal,
            updated_at: new Date().toISOString(),
          }, { onConflict: 'cliente_id,producto_id' });

        if (error) throw error;

        carritoMap.set(productoId, (carritoMap.get(productoId) || 0) + 1);
        refrescarAccionCard(productoId, precioFinal);
        actualizarFab();
        mostrarToast('Agregado al carrito');
      } catch (e) {
        mostrarToast('No se pudo agregar. Probá de nuevo.');
        if (btn) { btn.disabled = false; btn.innerHTML = 'Agregar'; }
      }
    }

    // FIX (auditoría UX): mismo guard que en carrito.html — evita que dos
    // clics rápidos en +/- disparen dos upserts/deletes concurrentes sobre
    // el mismo producto y dejen la cantidad desincronizada.
    const productosEnProceso = new Set();

    async function cambiarCantidadCatalogo(productoId, precioFinal, delta) {
      if (productosEnProceso.has(productoId)) return;
      productosEnProceso.add(productoId);
      const actual = carritoMap.get(productoId) || 0;
      const nueva = actual + delta;

      try {
        if (nueva <= 0) {
          const { error } = await sb.from('carrito_items')
            .delete().eq('cliente_id', clienteId).eq('producto_id', productoId);
          if (error) throw error;
          carritoMap.delete(productoId);
        } else {
          // Upsert en lugar de update: si por algún motivo el row no existe, lo crea
          const { error } = await sb.from('carrito_items')
            .upsert({
              empresa_id:    empresaId,
              cliente_id:    clienteId,
              producto_id:   productoId,
              cantidad:      nueva,
              precio_snap:   precioFinal,
              updated_at:    new Date().toISOString(),
            }, { onConflict: 'cliente_id,producto_id' });
          if (error) throw error;
          carritoMap.set(productoId, nueva);
        }
        refrescarAccionCard(productoId, precioFinal);
        actualizarFab();
      } catch (e) {
        console.error('[carrito] error update:', e);
        mostrarToast('No se pudo actualizar el carrito.');
      } finally {
        productosEnProceso.delete(productoId);
      }
    }

    function formatPeso(n) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(n) || 0);
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
  <script src="/frontend/shared/chat-widget.js" defer data-chat-asistente="1"></script>
</body>
