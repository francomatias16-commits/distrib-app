<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/cliente/manifest.json" />
  <meta name="theme-color" content="#19372D" />
  <title>Carrito — Fluxo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link rel="stylesheet" href="/shared/skeletons.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <link rel="stylesheet" href="/shared/tienda-nav.css?v=2" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4/dist/dexie.min.js"></script>

  <link rel="stylesheet" href="/cliente/css/carrito.css?v=3" />
  <link rel="stylesheet" href="/frontend/shared/chat-widget.css">
</head>
<body>
  <div class="topbar">
    <div class="topbar-row">
      <button class="btn-back" onclick="window.history.back()" aria-label="Volver" title="Volver">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
      </button>
      <h1>Mi carrito</h1>
      <button class="btn-vaciar" id="btnVaciar" style="display:none">Vaciar</button>
    </div>
    <p style="font-size:.8rem;opacity:.8;margin-top:.15rem">Revisá los productos antes de confirmar tu pedido</p>
  </div>

  <div class="contenido">
    <div id="listaCarrito"><div class="loading">Cargando carrito...</div></div>
    <div id="resumenWrap" style="display:none">
      <div class="notas-wrap">
        <div class="notas-label">Forma de pago</div>
        <div class="forma-pago-wrap" role="radiogroup" aria-label="Forma de pago">
          <label class="forma-pago-opt">
            <input type="radio" name="formaPago" id="fpCuentaCorriente" value="cuenta_corriente" checked>
            <span>
              <strong>Cuenta corriente</strong>
              <small>Se suma a tu saldo. Sujeto a tu límite de crédito.</small>
            </span>
          </label>
          <label class="forma-pago-opt">
            <input type="radio" name="formaPago" id="fpPagoInmediato" value="pago_inmediato">
            <span>
              <strong>Pago inmediato</strong>
              <small>Transferencia, efectivo u otro medio a coordinar con tu vendedor. No afecta tu cuenta corriente.</small>
            </span>
          </label>
        </div>
      </div>
      <div class="notas-wrap">
        <div class="notas-label">Notas para el pedido (opcional)</div>
        <textarea id="inputNotas" rows="2" placeholder="Ej: Entregar a la tarde, dejar en recepción..."></textarea>
      </div>
      <div class="resumen-card">
        <div class="resumen-row"><span>Subtotal</span><span id="txtSubtotal">$0</span></div>
        <div class="resumen-row total"><span>Total</span><span id="txtTotal">$0</span></div>
      </div>
    </div>
  </div>

  <div class="footer-confirm" id="footerConfirm" style="display:none">
    <button class="btn-confirmar" id="btnConfirmar">Confirmar pedido</button>
  </div>

  <nav class="nav-bottom">
    <a class="nav-item" href="/cliente/inicio">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>
      Inicio
    </a>
    <a class="nav-item" href="/cliente/catalogo">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/></svg>
      Catálogo
    </a>
    <a class="nav-item activo" href="/cliente/carrito">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
      Carrito
    </a>
    <a class="nav-item" href="/cliente/pedidos">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/></svg>
      Pedidos
    </a>
    <a class="nav-item" href="/cliente/cuenta">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      Cuenta
    </a>
  </nav>

  <!-- Modal éxito -->
  <div class="modal-overlay" id="modalExito">
    <div class="modal-card">
      <div class="modal-icon"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:0px"><circle cx="12" cy="12" r="10"/><polyline points="16 9 10.5 15 8 12.5"/></svg></div>
      <h3>¡Pedido confirmado!</h3>
      <p id="modalMensaje">Tu pedido fue enviado correctamente. Te avisamos cuando esté listo.</p>
      <button class="btn-modal" onclick="window.location.href='/cliente/pedidos'">Ver mis pedidos</button>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-cliente-auth' } });
    let session, usuario, items = [];

    // ── Hallazgo 3 (Etapa 1, Pedidos): idempotencia de la confirmación ──────
    // Se genera un UUID al entrar al carrito y viaja en cada intento de
    // confirmar. Si el fetch falla por red (timeout, se corta el 4G) pero el
    // pedido sí se había creado del lado del servidor, un reintento con la
    // MISMA key hace que crear_pedido_cliente() devuelva ese pedido en vez
    // de crear uno nuevo. Se guarda en sessionStorage (no localStorage) para
    // no arrastrar una key vieja entre pestañas/sesiones distintas del mismo
    // dispositivo. Se limpia recién cuando un pedido se confirma con éxito,
    // para que el próximo pedido arranque con una key nueva.
    const IDEM_KEY_STORAGE = 'carrito_idempotency_key';
    function obtenerIdempotencyKey() {
      let k = sessionStorage.getItem(IDEM_KEY_STORAGE);
      if (!k) {
        k = crypto.randomUUID();
        sessionStorage.setItem(IDEM_KEY_STORAGE, k);
      }
      return k;
    }
    function limpiarIdempotencyKey() {
      sessionStorage.removeItem(IDEM_KEY_STORAGE);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session: s } } = await sb.auth.getSession();
      if (!s) { window.location.href = '/cliente/login'; return; }
      session = s;

      const { data: u } = await sb.from('usuarios')
        .select('nombre, empresa_id, cliente_id')
        .eq('id', session.user.id).single();

      if (!u?.cliente_id) { window.location.href = '/cliente/login'; return; }
      usuario = u;

      window.ClienteOffline?.init({ getToken, empresaId: usuario.empresa_id });
      await cargarCarrito();
    });

    async function getToken() {
      const { data: { session: s } } = await sb.auth.getSession();
      return s?.access_token;
    }

    // Plan offline — Etapa 3, ítem 1: mismo criterio que chofer-offline.js
    // (remito.html) — distingue "el servidor respondió con un error de
    // negocio" (mostrarlo tal cual) de "el fetch no llegó a completarse"
    // (encolar y reintentar solo). fetch() rechaza con TypeError cuando no
    // hay conexión o se corta a mitad de camino.
    function esErrorDeRed(e) {
      return e instanceof TypeError || /failed to fetch|network/i.test(e?.message || '');
    }

    async function cargarCarrito() {
      const { data, error } = await sb.rpc('get_carrito_cliente', { p_cliente_id: usuario.cliente_id });
      const cont = document.getElementById('listaCarrito');

      if (error || !data?.length) {
        items = [];
        document.getElementById('resumenWrap').style.display = 'none';
        document.getElementById('footerConfirm').style.display = 'none';
        document.getElementById('btnVaciar').style.display = 'none';
        cont.innerHTML = `
          <div class="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-light)" stroke-width="1.5"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"/></svg>
            <p>Tu carrito está vacío</p>
            <a class="btn-ir-catalogo" href="/cliente/catalogo">Ver catálogo</a>
          </div>`;
        return;
      }

      items = data;
      document.getElementById('resumenWrap').style.display = 'block';
      document.getElementById('footerConfirm').style.display = 'block';
      document.getElementById('btnVaciar').style.display = 'block';

      cont.innerHTML = items.map(it => `
        <div class="carrito-item" id="item-${it.id}">
          <div class="item-img">
            ${it.foto_url
              ? `<img src="${esc(it.foto_url)}" alt="${esc(it.nombre)}" loading="lazy">`
              : `<svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="var(--color-text-light)" stroke-width="1.5"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M3 7l2-4h14l2 4"/></svg>`}
          </div>
          <div class="item-body">
            <div class="item-nombre">${esc(it.nombre)} ${it.combo_id ? '<span class="badge-combo">Combo</span>' : ''}</div>
            <div class="item-unidad">${esc(it.unidad || '')}</div>
            <div class="item-precio">${formatPeso(it.precio_snap)} c/u</div>
            <div class="item-controls">
              <button class="btn-qty" onclick="cambiarCantidad('${it.id}','${it.producto_id || ''}',-1)">−</button>
              <span class="qty-value" id="qty-${it.id}">${it.cantidad}</span>
              <button class="btn-qty" onclick="cambiarCantidad('${it.id}','${it.producto_id || ''}',1)">+</button>
              <button class="btn-eliminar" onclick="eliminarItem('${it.id}','${it.producto_id || ''}')" title="Eliminar">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3,6 5,6 21,6"/><path d="M19,6v14a2,2,0,0,1-2,2H7a2,2,0,0,1-2-2V6m3,0V4a1,1,0,0,1,1-1h4a1,1,0,0,1,1,1v2"/></svg>
              </button>
            </div>
          </div>
        </div>`).join('');

      actualizarResumen();
    }

    function actualizarResumen() {
      const subtotal = items.reduce((s, it) => s + it.cantidad * it.precio_snap, 0);
      document.getElementById('txtSubtotal').textContent = formatPeso(subtotal);
      document.getElementById('txtTotal').textContent = formatPeso(subtotal);
    }

    const itemsEnProceso = new Set();

    async function cambiarCantidad(itemId, productoId, delta) {
      if (itemsEnProceso.has(itemId)) return;
      itemsEnProceso.add(itemId);
      try {
        const it = items.find(i => i.id === itemId);
        if (!it) return;
        const nueva = it.cantidad + delta;
        if (nueva <= 0) { await _eliminarItemInterno(itemId); return; }

        const { error } = await sb.from('carrito_items')
          .update({ cantidad: nueva })
          .eq('id', itemId);

        if (!error) {
          it.cantidad = nueva;
          document.getElementById(`qty-${itemId}`).textContent = nueva;
          actualizarResumen();
        }
      } finally {
        itemsEnProceso.delete(itemId);
      }
    }

    async function eliminarItem(itemId, productoId) {
      if (itemsEnProceso.has(itemId)) return;
      itemsEnProceso.add(itemId);
      try {
        await _eliminarItemInterno(itemId);
      } finally {
        itemsEnProceso.delete(itemId);
      }
    }

    // Lógica real de borrado, sin el guard — la llaman tanto eliminarItem()
    // (clic directo) como cambiarCantidad() cuando la cantidad baja a 0.
    // El guard vive únicamente en los dos puntos de entrada de arriba para
    // no bloquearse a sí misma cuando cambiarCantidad ya reservó el item.
    async function _eliminarItemInterno(itemId) {
      await sb.from('carrito_items').delete().eq('id', itemId);
      items = items.filter(i => i.id !== itemId);
      const el = document.getElementById(`item-${itemId}`);
      if (el) el.remove();
      if (!items.length) await cargarCarrito();
      else actualizarResumen();
    }

    document.getElementById('btnVaciar').addEventListener('click', async () => {
      if (!confirm('¿Vaciar el carrito?')) return;
      await sb.from('carrito_items').delete().eq('cliente_id', usuario.cliente_id);
      await cargarCarrito();
    });

    document.getElementById('btnConfirmar').addEventListener('click', async () => {
      if (!items.length) return;
      const btn = document.getElementById('btnConfirmar');
      btn.disabled = true;
      btn.textContent = 'Procesando...';

      // Plan offline — Etapa 3, ítem 1: mismo payload para el POST online y
      // para el outbox — así carrito.html y cliente-offline.js comparten
      // siempre la misma idempotency_key para este intento de compra.
      const payload = {
        items: items.map(it => ({
          producto_id: it.producto_id || null,
          combo_id: it.combo_id || null,
          cantidad: it.cantidad,
        })),
        notas_cliente: document.getElementById('inputNotas').value.trim() || null,
        forma_pago: (document.querySelector('input[name="formaPago"]:checked') || {}).value || 'cuenta_corriente',
        canal: 'portal_cliente',
        // Hallazgo 3: misma key en cada intento de este carrito — si este
        // es un reintento tras un fallo de red, el servidor detecta que
        // ya existe y devuelve el mismo pedido en vez de duplicarlo.
        idempotency_key: obtenerIdempotencyKey(),
      };

      try {
        // Usar el endpoint seguro: verifica stock, resuelve precios en el servidor
        // y aplica toda la lógica de negocio (crédito, puntos, notificaciones).
        const token = session.access_token;
        const resp = await fetch('/api/pedidos?accion=confirmar', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'Authorization': `Bearer ${token}`,
          },
          body: JSON.stringify(payload),
        });

        // Hallazgo 4 (Etapa 1, Pedidos): antes un 401 (token vencido a mitad
        // de la compra) se mostraba con el mismo alert() crudo que cualquier
        // error de negocio ("Token inválido"), sin decirle al cliente qué
        // hacer. El carrito sobrevive en `carrito_items` en la base, así que
        // no se pierde nada al mandarlo a loguearse de nuevo.
        if (resp.status === 401) {
          alert('Tu sesión expiró. Iniciá sesión de nuevo para confirmar tu pedido — tu carrito no se pierde.');
          window.location.href = '/cliente/login';
          return;
        }

        const result = await resp.json();

        if (!resp.ok) {
          // Error de negocio (deuda, stock insuficiente, etc.)
          const msg = result.mensaje || result.error || 'Error al confirmar el pedido.';
          if (result.error === 'cliente_bloqueado') {
            alert('⚠ ' + msg);
          } else {
            alert(msg);
          }
          btn.disabled = false;
          btn.textContent = 'Confirmar pedido';
          return;
        }

        // Pedido confirmado (nuevo o, si este era un reintento, el mismo de
        // antes) — recién acá se libera la key para que el PRÓXIMO pedido
        // arranque con una nueva.
        limpiarIdempotencyKey();

        // Vaciar carrito local (el servidor ya lo hizo en DB si aplica)
        await sb.from('carrito_items').delete().eq('cliente_id', usuario.cliente_id);

        const nroPedido = result.numero_pedido || result.pedido_id?.slice(0, 8).toUpperCase() || 'recibido';
        document.getElementById('modalMensaje').textContent =
          `Tu pedido ${nroPedido} fue recibido. Te avisamos cuando esté preparado.`;
        document.getElementById('modalExito').classList.add('visible');

      } catch (e) {
        // Error de red real (fetch nunca llegó a completarse): NO se limpia
        // la idempotency_key acá a propósito — si el pedido sí se había
        // creado del lado del servidor, el próximo intento (manual o vía
        // outbox) reusa la misma key y el backend lo detecta en vez de
        // duplicarlo.
        if (esErrorDeRed(e) && window.ClienteOffline) {
          try {
            await window.ClienteOffline.encolarPedido(payload);
            // El payload ya se llevó su propia copia de la key; liberamos la
            // de sessionStorage para que el PRÓXIMO pedido arranque con una
            // nueva (si no, un pedido nuevo armado antes de que este
            // sincronice compartiría key con el que ya está en la cola).
            limpiarIdempotencyKey();
            await sb.from('carrito_items').delete().eq('cliente_id', usuario.cliente_id);
            document.getElementById('modalMensaje').textContent =
              'Sin conexión: guardamos tu pedido en el celular y se va a enviar solo cuando vuelva el internet.';
            document.getElementById('modalExito').classList.add('visible');
            btn.disabled = false;
            btn.textContent = 'Confirmar pedido';
            return;
          } catch (e2) {
            console.error('[ClienteOffline] No se pudo encolar el pedido:', e2);
          }
        }
        alert('Ocurrió un error de conexión al confirmar el pedido. Podés volver a intentar: si el pedido ya se había recibido, no se va a duplicar.');
        btn.disabled = false;
        btn.textContent = 'Confirmar pedido';
      }
    });

    function formatPeso(n) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(n) || 0);
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
  <script src="/frontend/shared/chat-widget.js" defer data-chat-asistente="1"></script>
</body>
</html>
