<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña — Panel Admin</title>
  <link rel="icon" type="image/png" href="/frontend/admin/img/icon-192.png" sizes="192x192">
  <link rel="apple-touch-icon" href="/frontend/admin/img/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="/shared/tokens.css?v=196" />
  <link rel="stylesheet" href="/shared/skeletons.css?v=196" />

  <link rel="stylesheet" href="/frontend/admin/css/login.css?v=199" />
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
</head>
<body>

<div class="login-card">

  <div class="login-avatar" aria-hidden="true">
    <svg viewBox="0 0 24 24">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
  </div>

  <h1 class="login-heading">Elegí tu contraseña</h1>
  <p class="login-subheading" id="subheading">Nueva contraseña para tu cuenta</p>

  <div class="alerta alerta-danger" id="alerta-error">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;margin-top:1px">
      <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
    </svg>
    <span id="texto-error"></span>
  </div>

  <div class="form-group" id="form-nueva-pass">

    <div class="login-field">
      <span class="login-field-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
      <input type="password" id="input-pass-nueva" placeholder="Contraseña nueva (mín. 8 caracteres)"
        aria-label="Contraseña nueva" autocomplete="new-password" />
    </div>

    <div class="login-field">
      <span class="login-field-icon">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </span>
      <input type="password" id="input-pass-confirmar" placeholder="Repetí la contraseña"
        aria-label="Confirmar contraseña" autocomplete="new-password" />
    </div>

  </div>

  <button type="button" class="login-btn-cta" id="btn-guardar" onclick="guardarPassword()">
    <span class="btn-spinner" id="btn-spinner"></span>
    <span class="btn-label">Guardar contraseña</span>
  </button>

  <a href="/admin/login" id="link-a-login" style="display:none;text-align:center;margin-top:16px;font-size:14.5px;color:var(--login-accent-dark);font-weight:600;text-decoration:none">
    Ir a iniciar sesión
  </a>

</div>

<div class="login-brand">
  Sistema de distribución con tecnología de
  <img src="/frontend/admin/img/logo-fluxo.png" alt="Fluxo">
</div>

<script>
const sb = window.supabaseClient || (window.supabaseClient = supabase.createClient(
  window.ENV?.SUPABASE_URL || '',
  window.ENV?.SUPABASE_ANON_KEY || '',
  { auth: { storageKey: 'sb-admin-auth' } }
));

let sesionRecuperacionLista = false;

document.addEventListener('DOMContentLoaded', async () => {
  // supabase-js parsea automáticamente el token de recuperación que viene
  // en el link del mail (#access_token=...&type=recovery) y arma una
  // sesión temporal habilitada SOLO para cambiar la contraseña. Si no hay
  // token válido (link vencido, ya usado, o entraron acá directo sin
  // pasar por el mail), no hay sesión y bloqueamos el formulario.
  const { data: { session } } = await sb.auth.getSession();

  if (!session) {
    bloquearFormulario('Este link no es válido o ya venció. Volvé al login y pedí uno nuevo desde "¿Olvidaste tu contraseña?".');
    return;
  }

  sesionRecuperacionLista = true;

  document.getElementById('input-pass-nueva').addEventListener('keydown', e => {
    if (e.key === 'Enter') document.getElementById('input-pass-confirmar').focus();
  });
  document.getElementById('input-pass-confirmar').addEventListener('keydown', e => {
    if (e.key === 'Enter') guardarPassword();
  });
});

function bloquearFormulario(msg) {
  document.getElementById('form-nueva-pass').style.display = 'none';
  document.getElementById('btn-guardar').style.display = 'none';
  document.getElementById('subheading').textContent = 'Link no disponible';
  mostrarError(msg);
  document.getElementById('link-a-login').style.display = '';
  document.getElementById('link-a-login').textContent = 'Volver al login';
}

async function guardarPassword() {
  if (!sesionRecuperacionLista) return;

  const pass = document.getElementById('input-pass-nueva').value;
  const confirmar = document.getElementById('input-pass-confirmar').value;
  document.getElementById('alerta-error').classList.remove('show');

  if (!pass || pass.length < 8) {
    mostrarError('La contraseña debe tener al menos 8 caracteres.');
    return;
  }
  if (pass !== confirmar) {
    mostrarError('Las contraseñas no coinciden.');
    return;
  }

  const btn = document.getElementById('btn-guardar');
  btn.disabled = true;
  btn.classList.add('loading');

  try {
    const { error } = await sb.auth.updateUser({ password: pass });
    if (error) {
      mostrarError('No se pudo actualizar la contraseña. Probá pedir un link nuevo.');
      return;
    }

    // Cerramos la sesión de recuperación para forzar el login normal con
    // la contraseña recién creada, en vez de dejarlo ya logueado acá.
    await sb.auth.signOut();
    window.location.href = '/admin/login?reset=ok';

  } catch {
    mostrarError('Error de conexión. Intentá de nuevo.');
  } finally {
    btn.disabled = false;
    btn.classList.remove('loading');
  }
}

function mostrarError(msg) {
  document.getElementById('texto-error').textContent = msg;
  document.getElementById('alerta-error').classList.add('show');
}
</script>
</body>
</html>
