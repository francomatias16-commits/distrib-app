<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ingresar — App Chofer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css?v=mtcen4r4" />
  <link rel="manifest" href="/chofer/manifest.json" />
  <meta name="theme-color" content="#F5F2EA" />
  <script src="/frontend/env-config.js?v=mtcen4r4"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <link rel="stylesheet" href="/chofer/css/login.css?v=mtcen4r4" />
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=mtcen4r4" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=mtcen4r4" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=mtcen4r4" />
  <script src="/shared/responsive-mobile.js?v=mtcen4r4" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=mtcen4r4" />
  <link rel="stylesheet" href="/shared/a11y-focus.css?v=mtcen4r4" />
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <circle cx="12" cy="8" r="4"/>
          <path d="M4 20c0-4.4 3.6-7 8-7s8 2.6 8 7"/>
        </svg>
      </div>
      <h1>Iniciar sesión</h1>
      <p>App Chofer</p>
    </div>

    <div class="login-body">
      <div id="alertaLogin" class="alerta alerta-err"></div>
      <div id="alertaOk" class="alerta alerta-ok"></div>

      <form id="formLogin">
        <div class="field-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="email" placeholder="Email" aria-label="Email" autocomplete="username" required>
        </div>
        <div class="field-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="password" placeholder="Contraseña" aria-label="Contraseña" autocomplete="current-password" required>
        </div>

        <div class="row-aux">
          <label>
            <input type="checkbox" id="recordar">
            Recordarme
          </label>
          <a href="#" id="linkOlvide">¿Olvidaste tu contraseña?</a>
        </div>

        <button type="submit" class="btn btn-primary" id="btnIngresar">Ingresar</button>
      </form>

      <!-- Mini-formulario de "olvidé mi contraseña": self-service, no
           requiere intervención del dueño. Oculto por defecto. -->
      <div id="formReset" style="display:none">
        <p class="nota-pie" style="margin:0 0 14px;justify-content:flex-start;text-align:left">
          Ingresá tu email y te mandamos un link para elegir una contraseña nueva.
        </p>
        <div class="field-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="emailReset" placeholder="Email" aria-label="Email">
        </div>
        <button type="button" class="btn btn-primary" id="btnEnviarReset" style="margin-top:1.4rem" onclick="solicitarReset()">Enviar link</button>
        <a href="#" id="linkVolverLogin" style="display:block;text-align:center;margin-top:14px;font-size:.85rem;color:var(--login-text-light);text-decoration:none">
          ← Volver a iniciar sesión
        </a>
      </div>

      <p class="nota-pie" id="notaPie">
        <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
        Acceso exclusivo para choferes habilitados
      </p>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-chofer-auth' } });

    document.addEventListener('DOMContentLoaded', async () => {
      // Si ya hay sesión activa, saltar directo a la ruta del día
      const { data: { session } } = await sb.auth.getSession();
      if (session) window.location.href = '/chofer';

      activarModoDemoSiCorresponde();
      mostrarMensajeReset();

      document.getElementById('linkOlvide').addEventListener('click', e => {
        e.preventDefault();
        mostrarFormReset();
      });
      document.getElementById('linkVolverLogin').addEventListener('click', e => {
        e.preventDefault();
        mostrarFormLogin();
      });
    });

    // ── "Olvidé mi contraseña": self-service vía Supabase Auth ──
    function mostrarFormReset() {
      document.getElementById('alertaLogin').style.display = 'none';
      document.getElementById('alertaOk').style.display = 'none';
      document.getElementById('formLogin').style.display = 'none';
      document.getElementById('formReset').style.display = '';
      document.getElementById('notaPie').style.display = 'none';
      document.getElementById('emailReset').value = document.getElementById('email').value;
      document.getElementById('emailReset').focus();
    }

    function mostrarFormLogin() {
      document.getElementById('alertaLogin').style.display = 'none';
      document.getElementById('alertaOk').style.display = 'none';
      document.getElementById('formReset').style.display = 'none';
      document.getElementById('formLogin').style.display = '';
      document.getElementById('notaPie').style.display = '';
    }

    async function solicitarReset() {
      const email = document.getElementById('emailReset').value.trim();
      const alertaErr = document.getElementById('alertaLogin');
      alertaErr.style.display = 'none';

      if (!email) {
        alertaErr.textContent = 'Ingresá tu email.';
        alertaErr.style.display = 'block';
        return;
      }

      const btn = document.getElementById('btnEnviarReset');
      btn.disabled = true;
      btn.textContent = 'Enviando...';

      try {
        await sb.auth.resetPasswordForEmail(email, {
          redirectTo: `${window.location.origin}/chofer/restablecer-password`,
        });
        // Mensaje genérico a propósito: no confirma si ese email existe o no.
        const alertaOk = document.getElementById('alertaOk');
        alertaOk.textContent = 'Si ese email está registrado, te enviamos un link para restablecer tu contraseña. Revisá tu casilla (y spam).';
        alertaOk.style.display = 'block';
      } catch {
        alertaErr.textContent = 'Error de conexión. Intentá de nuevo.';
        alertaErr.style.display = 'block';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Enviar link';
      }
    }

    // Si venimos redirigidos desde /chofer/restablecer-password tras un
    // cambio de contraseña exitoso, mostramos la confirmación acá.
    function mostrarMensajeReset() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('reset') === 'ok') {
        const alertaOk = document.getElementById('alertaOk');
        alertaOk.textContent = 'Contraseña actualizada. Iniciá sesión con tu nueva contraseña.';
        alertaOk.style.display = 'block';
      }
    }

    // Acceso público a la demo: /chofer/login?demo=1 precarga las mismas
    // credenciales de la demo pública del admin — el rol 'dueno' de esa
    // cuenta ya está habilitado para este portal (ver ROLES_CHOFER más
    // abajo), así que no hace falta ningún usuario nuevo. No autocompleta
    // ni envía sola: el usuario igual tiene que tocar "Ingresar".
    function activarModoDemoSiCorresponde() {
      const params = new URLSearchParams(window.location.search);
      if (params.get('demo') !== '1') return;

      document.getElementById('email').value = 'demo@distrib-test.local';
      document.getElementById('password').value = 'DistribDemo2026!';

      const aviso = document.createElement('div');
      aviso.style.cssText = 'background:#f0fdf4;color:#166534;border:1px solid #86efac;border-radius:8px;padding:10px 12px;font-size:13.5px;margin-bottom:14px;';
      aviso.textContent = 'Credenciales de la demo pública ya cargadas — cuenta compartida, se reinicia periódicamente. Tocá "Ingresar" para entrar.';
      document.getElementById('formLogin')?.insertAdjacentElement('beforebegin', aviso);
    }

    // FIX (29/8, mismo patrón que frontend/admin/login.html — incidente
    // Supabase Auth "Increased response times"): sin esto, signInWithPassword()
    // puede colgarse para siempre si Supabase Auth está degradado.
    const TIMEOUT_LOGIN_MS = 8000;
    function conTimeout(promesa, ms = TIMEOUT_LOGIN_MS) {
      return Promise.race([
        promesa,
        new Promise((_, reject) => setTimeout(() => {
          const err = new Error('timeout');
          err.esTimeoutLogin = true;
          reject(err);
        }, ms)),
      ]);
    }

    document.getElementById('formLogin').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('btnIngresar');
      const alerta = document.getElementById('alertaLogin');
      alerta.style.display = 'none';

      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      btn.disabled = true; btn.textContent = 'Ingresando...';
      try {
        const { data, error } = await conTimeout(sb.auth.signInWithPassword({ email, password }));
        if (error) throw new Error('Email o contraseña incorrectos');

        // Verificar que el usuario tenga un rol habilitado para el portal del chofer
        const { data: perfil, error: errPerfil } = await conTimeout(sb
          .from('usuarios')
          .select('rol')
          .eq('id', data.user.id)
          .single());

        const ROLES_CHOFER = ['chofer', 'dueno', 'admin'];
        if (errPerfil || !perfil || !ROLES_CHOFER.includes(perfil.rol)) {
          await sb.auth.signOut();
          throw new Error('Tu cuenta no tiene acceso al portal del chofer');
        }

        window.location.href = '/chofer';
      } catch (err) {
        alerta.textContent = err?.esTimeoutLogin
          ? 'El servicio de autenticación está lento. Probá de nuevo en unos segundos.'
          : (err.message || 'No se pudo iniciar sesión');
        alerta.style.display = 'block';
        btn.disabled = false; btn.textContent = 'Ingresar';
      }
    });
  </script>
  <script src="/chofer/pwa-init.js?v=mtcen4r4"></script>
</body>
</html>
