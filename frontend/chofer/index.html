<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Ruta de hoy — App Chofer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css?v=197" />
  <link rel="manifest" href="/chofer/manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/frontend/shared/realtime.js?v1" defer></script>
  <script src="/chofer/gps-tracker.js"></script>
  <link rel="stylesheet" href="/chofer/css/index.css?v=1" />
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <link rel="stylesheet" href="/shared/a11y-focus.css?v=1" />
  <link rel="stylesheet" href="/frontend/shared/chat-widget.css">
</head>
<body>
  <div class="topbar">
    <div>
      <h1>Ruta de hoy</h1>
      <p id="fechaHoy"></p>
    </div>
    <button type="button" class="btn-salir" id="btnActivarPush" style="display:none" title="Activar notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
    </button>
    <a href="/chofer/notificaciones" class="btn-salir" title="Ver historial de notificaciones" aria-label="Ver historial de notificaciones">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
    </a>
    <button type="button" class="btn-salir" id="btnSalir" title="Cerrar sesión">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>

  <div class="contenido">
    <div class="resumen-bar" id="resumenBar" style="display:none">
      <div class="resumen-chip"><div class="num" id="numTotal">0</div><div class="lbl">Total</div></div>
      <div class="resumen-chip"><div class="num" id="numPendientes">0</div><div class="lbl">Pendientes</div></div>
      <div class="resumen-chip"><div class="num" id="numEntregados">0</div><div class="lbl">Entregados</div></div>
    </div>

    <div id="listaRemitos"><div class="loading">Cargando ruta de hoy...</div></div>
  </div>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-chofer-auth' } });
    // FIX (auditoría 2026, etapa 15, Hallazgo 1 — causa 1): push-init.js
    // busca la sesión vía `window.authCtx.sb` (convención del panel admin).
    // El portal chofer nunca seteaba ese global, así que registrarDispositivo()
    // encontraba `session` undefined y abortaba en silencio — el permiso del
    // navegador podía quedar "granted" pero ningún token llegaba a guardarse
    // en dispositivos_push.
    window.authCtx = { sb };

    const CHIP_LABEL = { confirmado: 'Por despachar', preparando: 'Preparando', despachado: 'En camino', entregado: 'Entregado' };

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '/chofer/login'; return; }

      document.getElementById('fechaHoy').textContent = new Date().toLocaleDateString('es-AR', {
        weekday: 'long', day: 'numeric', month: 'long',
      });

      await cargarRuta();
    });

    document.getElementById('btnSalir').addEventListener('click', async () => {
      if (!confirm('¿Cerrar sesión?')) return;
      await sb.auth.signOut();
      window.location.href = '/chofer/login';
    });

    let rutaIdSuscripta = null;

    async function cargarRuta() {
      const cont = document.getElementById('listaRemitos');
      try {
        const { data: { session } } = await sb.auth.getSession();
        const token = session?.access_token;

        const r = await fetch('/api/chofer/remitos', {
          headers: { Authorization: `Bearer ${token}` },
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al cargar la ruta');

        const remitos = data.remitos || [];
        pintarResumen(remitos);
        iniciarRealtimeChofer(data.ruta_id);

        if (!remitos.length) {
          cont.innerHTML = `
            <div class="empty-state">
              <svg width="48" height="48" viewBox="0 0 24 24" fill="none" stroke="#9ca3af" stroke-width="1.5">
                <rect x="1" y="3" width="15" height="13" rx="2"/><path d="M16 8h4l3 5v4h-7V8z"/>
                <circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/>
              </svg>
              <div>No tenés remitos asignados para hoy.</div>
            </div>
            <button type="button" class="btn-refrescar" id="btnRefrescar">Actualizar</button>
          `;
        } else {
          cont.innerHTML = remitos.map(pintarCardRemito).join('') +
            `<button type="button" class="btn-refrescar" id="btnRefrescar">Actualizar</button>`;
        }

        document.getElementById('btnRefrescar').addEventListener('click', cargarRuta);
        cont.querySelectorAll('.card-remito').forEach(card => {
          card.addEventListener('click', () => {
            window.location.href = `/chofer/remito?id=${card.dataset.id}`;
          });
        });
      } catch (e) {
        cont.innerHTML = `<div class="empty-state">${esc(e.message)}</div>
          <button type="button" class="btn-refrescar" id="btnRefrescar">Reintentar</button>`;
        document.getElementById('btnRefrescar').addEventListener('click', cargarRuta);
      }
    }

    /* ══════════════════════════════════════════════════════════════
       Realtime (Fase 2 del plan de sincronización ERP). Suscribe a
       `entregas` filtrado por `ruta_id` — cubre tanto que el admin
       agregue/confirme un pedido nuevo a la ruta de hoy (confirmarRuta()
       inserta la fila en `entregas`) como que otro dispositivo/sesión
       del propio chofer marque una entrega. Filtrado por `ruta_id` (no
       solo por `empresa_id` como el dashboard admin) a propósito: es el
       filtro más ajustado que permite el modelo de datos, así el chofer
       nunca recibe en el payload del canal filas de rutas de otros
       choferes de la misma empresa. Debounce de 800ms, mismo criterio
       que dashboard.html.
       ══════════════════════════════════════════════════════════════ */
    let _debounceRealtimeRuta = null;
    function iniciarRealtimeChofer(rutaId) {
      if (!rutaId || rutaId === rutaIdSuscripta) return; // nada que cambiar
      if (!window.DistribRealtime) {
        console.error('[chofer] DistribRealtime no está disponible — Realtime desactivado en esta carga.');
        return;
      }
      rutaIdSuscripta = rutaId;
      window.DistribRealtime.suscribir({
        sb,
        nombreCanal: 'chofer-entregas',
        tabla:       'entregas',
        filtro:      `ruta_id=eq.${rutaId}`,
        onCambio:    () => {
          clearTimeout(_debounceRealtimeRuta);
          _debounceRealtimeRuta = setTimeout(cargarRuta, 800);
        },
      });
    }

    function pintarResumen(remitos) {
      const bar = document.getElementById('resumenBar');
      if (!remitos.length) { bar.style.display = 'none'; return; }
      const entregados = remitos.filter(r => r.estado === 'entregado').length;
      document.getElementById('numTotal').textContent = remitos.length;
      document.getElementById('numEntregados').textContent = entregados;
      document.getElementById('numPendientes').textContent = remitos.length - entregados;
      bar.style.display = 'flex';
    }

    function pintarCardRemito(r) {
      const cliente = r.clientes || {};
      const nombre = cliente.nombre_fantasia || cliente.razon_social || 'Cliente sin nombre';
      const chipClase = `chip-${r.estado}`;
      const chipTxt = CHIP_LABEL[r.estado] || r.estado;

      return `
        <div class="card-remito" data-id="${r.id}">
          <div class="card-remito-top">
            <div>
              <div class="cliente-nombre">${esc(nombre)}</div>
              <div class="cliente-detalle">${esc(cliente.domicilio || 'Sin domicilio registrado')}</div>
              <div class="numero-pedido">#${esc(r.numero_pedido)}</div>
            </div>
            <span class="chip ${chipClase}">${esc(chipTxt)}</span>
          </div>
          <div class="card-remito-bottom">
            <span class="total-chico">${formatPeso(r.total)}${r.forma_pago === 'pago_inmediato' && r.estado !== 'entregado' ? ` <span class="chip chip-amarillo" style="margin-left:.3rem;font-size:.7rem" title="Cobrar al entregar">$ Cobrar</span>` : ''}</span>
            <span class="flecha">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="9 18 15 12 9 6"/></svg>
            </span>
          </div>
        </div>`;
    }

    function formatPeso(n) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(n) || 0);
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
  <script src="/chofer/pwa-init.js"></script>
  <script type="module" src="/frontend/js/push-init.js"></script>
  <script>
    // FIX (auditoría 2026, etapa 15, Hallazgo 1 — causa 1): el portal
    // chofer nunca cargaba push-init.js ni pedía permiso — por eso ningún
    // chofer tenía dispositivos registrados para recibir push (ej. "ruta
    // asignada").
    (function () {
      const btn = document.getElementById('btnActivarPush');
      if (!btn || !('Notification' in window)) return;

      function actualizarVisibilidad() {
        btn.style.display = (Notification.permission === 'default') ? '' : 'none';
      }
      actualizarVisibilidad();

      btn.addEventListener('click', async () => {
        btn.disabled = true;
        try {
          const ok = await window.solicitarPermisoNotificaciones?.();
          if (typeof mostrarToast === 'function') {
            mostrarToast(ok ? 'Notificaciones activadas.' : 'No se pudo activar las notificaciones.');
          }
        } finally {
          btn.disabled = false;
          actualizarVisibilidad();
        }
      });
    })();
  </script>
  <script src="/frontend/shared/chat-widget.js" defer data-chat-asistente="1"></script>
</body>
</html>
