<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Remito — App Chofer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css?v=196" />
  <link rel="manifest" href="/chofer/manifest.json" />
  <meta name="theme-color" content="#2563EB" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dexie@4/dist/dexie.min.js"></script>
  <script src="/shared/offline-core.js?v1"></script>
  <script src="/chofer/chofer-offline.js"></script>
  <script src="/chofer/gps-tracker.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: #f0f4f8; min-height: 100vh; padding-bottom: 2rem; }

    .topbar {
      background: linear-gradient(135deg, #1D4ED8 0%, #2563EB 100%);
      color: var(--color-surface); padding: 1.1rem 1.25rem 1.4rem;
      display: flex; align-items: center; gap: .75rem;
    }
    .btn-volver { background: none; border: none; color: var(--color-surface); cursor: pointer; padding: .2rem; }
    .topbar h1 { font-size: 1.05rem; font-weight: 700; }
    .topbar p { font-size: .78rem; opacity: .8; margin-top: .1rem; }

    .contenido { padding: 1rem; max-width: 480px; margin: 0 auto; }
    .loading, .empty-state { text-align: center; color: var(--color-text-muted); padding: 3rem 1rem; font-size: .9rem; }

    .card { background: var(--color-surface); border-radius: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.08); padding: 1rem 1.1rem; margin-bottom: 1rem; }
    .card h2 { font-size: .85rem; font-weight: 700; color: var(--color-text); text-transform: uppercase; letter-spacing: .03em; margin-bottom: .65rem; }

    .cliente-nombre { font-size: 1.05rem; font-weight: 700; color: #111827; }
    .cliente-detalle { font-size: .85rem; color: var(--color-text-muted); margin-top: .2rem; }
    .cliente-tel { display: inline-flex; align-items: center; gap: .3rem; margin-top: .5rem; font-size: .85rem; color: var(--color-info-mid); text-decoration: none; }

    .item-row { display: flex; justify-content: space-between; padding: .55rem 0; border-bottom: 1px solid #f3f4f6; font-size: .88rem; }
    .item-row:last-child { border-bottom: none; }
    .item-nombre { color: #111827; }
    .item-cant { color: var(--color-text-muted); font-size: .8rem; }

    .total-row { display: flex; justify-content: space-between; padding-top: .65rem; margin-top: .4rem; border-top: 1px solid var(--color-border-soft); font-weight: 700; font-size: .95rem; }

    .chip { display: inline-block; font-size: .7rem; font-weight: 600; padding: .2rem .6rem; border-radius: 20px; text-transform: uppercase; letter-spacing: .02em; }
    .chip-confirmado { background: var(--color-success-bg); color: var(--color-success-mid); }
    .chip-preparando { background: var(--color-warning-bg); color: var(--color-warning); }
    .chip-despachado { background: var(--color-info-bg); color: var(--color-primary-dark); }
    .chip-entregado { background: var(--color-border-soft); color: var(--color-text-muted); }

    .btn { width: 100%; padding: .85rem; border: none; border-radius: 10px; font-size: .95rem; font-weight: 600; cursor: pointer; margin-bottom: .65rem; }
    .btn-primary { background: #2563EB; color: var(--color-surface); }
    .btn-primary:hover { background: #134a82; }
    .btn-success { background: #28a745; color: var(--color-surface); }
    .btn-success:hover { background: #1e7e34; }
    .btn-outline { background: var(--color-surface); color: var(--color-danger-mid); border: 1px solid #f1b0b7; }
    .btn-outline:hover { background: var(--color-danger-bg); }
    .btn-danger { background: #dc3545; color: var(--color-surface); }
    .btn-danger:hover { background: #b52a37; }
    .btn:disabled { opacity: .6; cursor: not-allowed; }

    /* ── Modal devolución ── */
    .overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.5);
      display: none; align-items: flex-end; justify-content: center; z-index: 50;
    }
    .overlay.show { display: flex; }
    .modal {
      background: var(--color-surface); width: 100%; max-width: 480px; max-height: 90vh; overflow-y: auto;
      border-radius: 16px 16px 0 0; padding: 1.25rem 1.25rem 1.5rem;
    }
    .modal h2 { font-size: 1.05rem; font-weight: 700; margin-bottom: 1rem; }

    .form-group { margin-bottom: 1rem; }
    .form-group label { display: block; font-size: .78rem; font-weight: 600; color: var(--color-text); margin-bottom: .35rem; text-transform: uppercase; letter-spacing: .02em; }
    .form-group select, .form-group textarea {
      width: 100%; padding: .7rem .85rem; border: 1px solid var(--color-border); border-radius: 10px; font-size: .92rem; font-family: inherit; outline: none;
    }
    .form-group select:focus, .form-group textarea:focus { border-color: #2563EB; }

    .item-devol { display: flex; align-items: center; gap: .6rem; padding: .55rem 0; border-bottom: 1px solid #f3f4f6; }
    .item-devol:last-child { border-bottom: none; }
    .item-devol label { flex: 1; font-size: .88rem; color: #111827; font-weight: 500; text-transform: none; margin: 0; }
    .item-devol input[type="number"] {
      width: 64px; padding: .4rem .5rem; border: 1px solid var(--color-border); border-radius: 8px; font-size: .88rem; text-align: center;
    }
    .item-devol input[type="checkbox"] { width: 18px; height: 18px; }

    .foto-input-wrap { position: relative; }
    .foto-preview { width: 100%; border-radius: 10px; margin-top: .6rem; max-height: 200px; object-fit: cover; display: none; }
    .btn-foto {
      width: 100%; padding: .75rem; border: 1px dashed #9ca3af; border-radius: 10px;
      background: var(--color-surface-2); color: #4b5563; font-size: .85rem; cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: .4rem;
    }

    .alerta { border-radius: 8px; padding: .65rem .85rem; font-size: .85rem; margin-bottom: 1rem; display: none; }
    .alerta-err { background: var(--color-danger-bg); color: var(--color-danger); border: 1px solid #fca5a5; }
    .alerta-ok { background: #ecfdf5; color: #065f46; border: 1px solid #a7f3d0; }

    /* ── Modal confirmar entrega: firma digital + foto ── */
    .firma-wrap { border: 1px solid var(--color-border); border-radius: 10px; overflow: hidden; touch-action: none; background: var(--color-surface); }
    #canvasFirma { width: 100%; height: 160px; display: block; cursor: crosshair; }
    .firma-hint { font-size: .75rem; color: var(--color-text-light); margin-top: .35rem; }
    .btn-link-chico { background: none; border: none; color: var(--color-info-mid); font-size: .8rem; font-weight: 600; cursor: pointer; padding: .3rem 0; margin-top: .2rem; }
    .form-group input[type="text"] {
      width: 100%; padding: .7rem .85rem; border: 1px solid var(--color-border); border-radius: 10px; font-size: .92rem; font-family: inherit; outline: none;
    }
    .form-group input[type="text"]:focus { border-color: #2563EB; }
    .cobro-grid { display: grid; grid-template-columns: 1fr 1.3fr; gap: .5rem; }
    .cobro-grid input, .cobro-grid select {
      padding: .7rem .85rem; border: 1px solid var(--color-border); border-radius: 10px; font-size: .92rem; font-family: inherit; outline: none;
    }
    .cobro-grid input:focus, .cobro-grid select:focus { border-color: #2563EB; }
  </style>
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>

  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <link rel="stylesheet" href="/shared/a11y-focus.css?v=1" />
  <link rel="stylesheet" href="/frontend/shared/chat-widget.css">
</head>
<body>
  <div class="topbar">
    <button type="button" class="btn-volver" onclick="window.location.href='/chofer'" aria-label="Volver">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <div>
      <h1>Detalle de entrega</h1>
      <p id="numeroRemito"></p>
    </div>
  </div>

  <div class="contenido">
    <div id="cuerpoRemito"><div class="loading">Cargando remito...</div></div>
  </div>

  <!-- ── Modal de devolución ── -->
  <div class="overlay" id="overlayDevolucion">
    <div class="modal">
      <h2>Registrar devolución</h2>
      <div id="alertaDevolucion" class="alerta"></div>

      <div class="form-group">
        <label>Motivo</label>
        <select id="motivoDevolucion">
          <option value="producto_defectuoso">Producto defectuoso</option>
          <option value="error_pedido">Error en el pedido</option>
          <option value="cliente_arrepentido">Cliente arrepentido</option>
          <option value="vencido">Producto vencido</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Productos a devolver</label>
        <div id="listaItemsDevolucion"></div>
      </div>

      <div class="form-group">
        <label>Notas</label>
        <textarea id="notasDevolucion" rows="2" placeholder="Detalle adicional (opcional)"></textarea>
      </div>

      <div class="form-group">
        <label>Foto</label>
        <div class="foto-input-wrap">
          <button type="button" class="btn-foto" id="btnTomarFoto"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Tomar o adjuntar foto</button>
          <input type="file" id="inputFoto" accept="image/*" capture="environment" style="display:none">
          <img id="previewFoto" class="foto-preview" alt="Vista previa de la foto de entrega">
        </div>
      </div>

      <button type="button" class="btn btn-success" id="btnConfirmarDevolucion">Confirmar devolución</button>
      <button type="button" class="btn btn-outline" id="btnCancelarDevolucion" style="background:var(--color-surface);color:var(--color-text-muted);border:1px solid var(--color-border)">Cancelar</button>
    </div>
  </div>

  <!-- ── Modal de "no se pudo entregar" ── -->
  <!-- FIX (auditoría etapa 6 — Hallazgo 1): este flujo estaba documentado y
       soportado por el backend (columna, template de WhatsApp, estado
       'no_entregado' que el admin ya mostraba) pero no existía ningún
       botón para que el chofer lo disparara. Se replica el mismo patrón
       que el modal de devolución. -->
  <div class="overlay" id="overlayNoEntrega">
    <div class="modal">
      <h2>No se pudo entregar</h2>
      <div id="alertaNoEntrega" class="alerta"></div>

      <div class="form-group">
        <label>Motivo</label>
        <select id="motivoNoEntrega">
          <option value="nadie_en_casa">Nadie en casa</option>
          <option value="rechazo">Cliente rechazó la mercadería</option>
          <option value="direccion_incorrecta">Dirección incorrecta / no encontrada</option>
          <option value="otro">Otro</option>
        </select>
      </div>

      <div class="form-group">
        <label>Notas</label>
        <textarea id="notasNoEntrega" rows="2" placeholder="Detalle adicional (opcional)"></textarea>
      </div>

      <div class="form-group">
        <label>Foto (opcional)</label>
        <div class="foto-input-wrap">
          <button type="button" class="btn-foto" id="btnTomarFotoNoEntrega"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Tomar o adjuntar foto</button>
          <input type="file" id="inputFotoNoEntrega" accept="image/*" capture="environment" style="display:none">
          <img id="previewFotoNoEntrega" class="foto-preview" alt="Vista previa de la foto">
        </div>
      </div>

      <button type="button" class="btn btn-danger" id="btnConfirmarNoEntrega">Confirmar no entrega</button>
      <button type="button" class="btn btn-outline" id="btnCancelarNoEntrega" style="background:var(--color-surface);color:var(--color-text-muted);border:1px solid var(--color-border)">Cancelar</button>
    </div>
  </div>

  <!-- ── Modal de confirmar entrega (firma + foto de conformidad) ── -->
  <div class="overlay" id="overlayEntrega">
    <div class="modal">
      <h2>Confirmar entrega</h2>
      <div id="alertaEntrega" class="alerta"></div>

      <div class="form-group">
        <label>Firma de quien recibe</label>
        <div class="firma-wrap">
          <canvas id="canvasFirma"></canvas>
        </div>
        <div class="firma-hint">Pasale el celular a quien recibe para que firme con el dedo</div>
        <button type="button" class="btn-link-chico" id="btnLimpiarFirma">Borrar y firmar de nuevo</button>
      </div>

      <div class="form-group">
        <label>Nombre de quien recibe (opcional)</label>
        <input type="text" id="receptorEntrega" placeholder="Ej: Juan (encargado)">
      </div>

      <div class="form-group">
        <label>¿Cobraste algo en esta entrega? (opcional)</label>
        <div class="cobro-grid">
          <input type="number" id="cobroMonto" placeholder="Monto" min="0" step="0.01" inputmode="decimal">
          <select id="cobroMedio">
            <option value="">Medio de pago</option>
            <option value="efectivo">Efectivo</option>
            <option value="transferencia">Transferencia</option>
            <option value="cheque">Cheque</option>
            <option value="otro">Otro</option>
          </select>
        </div>
        <div class="firma-hint">Si el cliente ya paga por cuenta corriente o no cobraste nada ahora, dejá esto vacío.</div>
      </div>

      <div class="form-group">
        <label>Foto de conformidad (opcional)</label>
        <div class="foto-input-wrap">
          <button type="button" class="btn-foto" id="btnTomarFotoEntrega"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>Tomar o adjuntar foto</button>
          <input type="file" id="inputFotoEntrega" accept="image/*" capture="environment" style="display:none">
          <img id="previewFotoEntrega" class="foto-preview" alt="Vista previa de la foto de entrega">
        </div>
      </div>

      <div class="form-group">
        <label>Notas (opcional)</label>
        <textarea id="notasEntrega" rows="2" placeholder="Detalle adicional"></textarea>
      </div>

      <button type="button" class="btn btn-success" id="btnConfirmarEntregaFinal">Confirmar entrega</button>
      <button type="button" class="btn btn-outline" id="btnCancelarEntrega" style="background:var(--color-surface);color:var(--color-text-muted);border:1px solid var(--color-border)">Cancelar</button>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-chofer-auth' } });
    const params = new URLSearchParams(window.location.search);
    const pedidoId = params.get('id');

    let remitoActual = null;
    let fotoBase64 = null;

    const CHIP_LABEL = { confirmado: 'Por despachar', preparando: 'Preparando', despachado: 'En camino', entregado: 'Entregado' };
    const MEDIO_LABEL = { efectivo: 'Efectivo', transferencia: 'Transferencia', cheque: 'Cheque', otro: 'Otro' };

    document.addEventListener('DOMContentLoaded', async () => {
      const { data: { session } } = await sb.auth.getSession();
      if (!session) { window.location.href = '/chofer/login'; return; }
      if (!pedidoId) { document.getElementById('cuerpoRemito').innerHTML = '<div class="empty-state">Remito no especificado.</div>'; return; }
      window.ChoferOffline?.init({ getToken });
      await cargarRemito();
    });

    async function getToken() {
      const { data: { session } } = await sb.auth.getSession();
      return session?.access_token;
    }

    // Plan offline — Etapa 3: distingue "el servidor respondió con un
    // error" (hay que mostrárselo al chofer) de "no llegó a haber
    // respuesta" (hay que encolar y reintentar solo). fetch() rechaza con
    // TypeError cuando no hay conexión o se corta a mitad de camino.
    function esErrorDeRed(e) {
      return e instanceof TypeError || /failed to fetch|network/i.test(e?.message || '');
    }

    async function cargarRemito() {
      const cont = document.getElementById('cuerpoRemito');
      try {
        const token = await getToken();
        const r = await fetch(`/api/chofer/remitos?id=${pedidoId}`, { headers: { Authorization: `Bearer ${token}` } });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'No se pudo cargar el remito');

        remitoActual = data;
        // Plan offline, Etapa 4: recién acá se conoce el empresa_id real
        // (viene del servidor, ver obtenerRemitoDetalle) — se lo pasamos a
        // ChoferOffline para que el outbox/caché local quede scopeado por
        // empresa desde este punto en adelante (ver setEmpresaId en
        // chofer-offline.js).
        window.ChoferOffline?.setEmpresaId(data.empresa_id);
        document.getElementById('numeroRemito').textContent = `#${data.numero_pedido}`;
        renderRemito(data);
      } catch (e) {
        console.error(e);
        cont.innerHTML = `<div class="empty-state">${esc(e.message)}</div>`;
      }
    }

    function renderRemito(d) {
      const cliente = d.clientes || {};
      const nombre = cliente.nombre_fantasia || cliente.razon_social || 'Cliente';
      const items = d.pedido_items || [];
      const chipClase = `chip-${d.estado}`;
      const chipTxt = CHIP_LABEL[d.estado] || d.estado;

      const itemsHtml = items.map(it => `
        <div class="item-row">
          <div>
            <div class="item-nombre">${esc(it.productos?.nombre || 'Producto')}</div>
            <div class="item-cant">${it.cantidad} ${esc(it.productos?.unidad || 'un.')} × ${formatPeso(it.precio_unitario)}</div>
          </div>
          <div>${formatPeso(it.subtotal)}</div>
        </div>`).join('');

      let accionesHtml = '';
      if (d.estado === 'confirmado' || d.estado === 'preparando') {
        accionesHtml += `<button type="button" class="btn btn-primary" id="btnDespachar">Marcar como despachado</button>`;
      }
      if (d.estado === 'despachado') {
        accionesHtml += `<button type="button" class="btn btn-success" id="btnEntregar">Marcar entregado</button>`;
        accionesHtml += `<button type="button" class="btn btn-danger" id="btnNoEntregar" style="margin-top:.5rem">No se pudo entregar</button>`;
      }
      if (d.estado === 'despachado' || d.estado === 'entregado') {
        accionesHtml += `<button type="button" class="btn btn-outline" id="btnAbrirDevolucion">Registrar devolución</button>`;
      }

      document.getElementById('cuerpoRemito').innerHTML = `
        <div class="card">
          <span class="chip ${chipClase}">${esc(chipTxt)}</span>
          <div class="cliente-nombre" style="margin-top:.5rem">${esc(nombre)}</div>
          <div class="cliente-detalle">${esc(cliente.domicilio || 'Sin domicilio registrado')}</div>
          ${cliente.telefono ? `<a class="cliente-tel" href="tel:${esc(cliente.telefono)}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${esc(cliente.telefono)}</a>` : ''}
          ${d.estado === 'entregado' && d.monto_cobrado ? `<div class="cliente-detalle" style="margin-top:.5rem;color:var(--color-success);font-weight:600"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" style="vertical-align:-3px;margin-right:4px"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 6v12M18 6v12"/></svg>Cobraste ${formatPeso(d.monto_cobrado)} (${esc(MEDIO_LABEL[d.medio_cobro] || d.medio_cobro)})</div>` : ''}
        </div>

        <div class="card">
          <h2>Productos</h2>
          ${itemsHtml || '<div class="empty-state" style="padding:1rem">Sin ítems</div>'}
          <div class="total-row"><span>Total</span><span>${formatPeso(d.total)}</span></div>
        </div>

        <div class="card">
          ${accionesHtml}
        </div>
      `;

      document.getElementById('btnDespachar')?.addEventListener('click', marcarDespachado);
      document.getElementById('btnEntregar')?.addEventListener('click', marcarEntregado);
      document.getElementById('btnNoEntregar')?.addEventListener('click', abrirModalNoEntrega);
      document.getElementById('btnAbrirDevolucion')?.addEventListener('click', abrirModalDevolucion);
    }

    async function marcarDespachado() {
      const btn = document.getElementById('btnDespachar');
      btn.disabled = true; btn.textContent = 'Despachando...';
      try {
        const token = await getToken();
        const r = await fetch('/api/chofer/remitos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ pedido_id: pedidoId }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al despachar');
        await cargarRemito();
      } catch (e) {
        alert(e.message);
        btn.disabled = false; btn.textContent = 'Marcar como despachado';
      }
    }

    // ── Confirmar entrega (firma digital + foto de conformidad) ─────────────
    let fotoEntregaBase64 = null;
    let firmaCtx = null;
    let firmaTieneTrazo = false;
    let firmaDibujando = false;

    function marcarEntregado() {
      abrirModalEntrega();
    }

    function abrirModalEntrega() {
      fotoEntregaBase64 = null;
      document.getElementById('alertaEntrega').style.display = 'none';
      document.getElementById('notasEntrega').value = '';
      document.getElementById('receptorEntrega').value = '';
      document.getElementById('cobroMonto').value = '';
      document.getElementById('cobroMedio').value = '';
      document.getElementById('previewFotoEntrega').style.display = 'none';
      document.getElementById('overlayEntrega').classList.add('show');
      // Mientras no haya firma, el botón pulsa para guiar la atención del chofer.
      document.getElementById('btnConfirmarEntregaFinal').classList.add('urgente--pulso');
      // El canvas recién tiene tamaño real una vez visible, por eso se
      // inicializa acá adentro y no en DOMContentLoaded.
      requestAnimationFrame(inicializarCanvasFirma);
    }

    function inicializarCanvasFirma() {
      const canvas = document.getElementById('canvasFirma');
      const rect = canvas.getBoundingClientRect();
      const dpr = window.devicePixelRatio || 1;
      canvas.width = rect.width * dpr;
      canvas.height = rect.height * dpr;
      firmaCtx = canvas.getContext('2d');
      firmaCtx.scale(dpr, dpr);
      firmaCtx.lineWidth = 2.2;
      firmaCtx.lineCap = 'round';
      firmaCtx.strokeStyle = '#111827';
      firmaTieneTrazo = false;

      const posicion = (e) => {
        const r = canvas.getBoundingClientRect();
        const p = e.touches ? e.touches[0] : e;
        return { x: p.clientX - r.left, y: p.clientY - r.top };
      };
      const empezar = (e) => {
        e.preventDefault();
        firmaDibujando = true;
        const { x, y } = posicion(e);
        firmaCtx.beginPath();
        firmaCtx.moveTo(x, y);
      };
      const dibujar = (e) => {
        if (!firmaDibujando) return;
        e.preventDefault();
        const { x, y } = posicion(e);
        firmaCtx.lineTo(x, y);
        firmaCtx.stroke();
        if (!firmaTieneTrazo) {
          firmaTieneTrazo = true;
          document.getElementById('btnConfirmarEntregaFinal').classList.remove('urgente--pulso');
        }
      };
      const terminar = () => { firmaDibujando = false; };

      canvas.onmousedown = empezar; canvas.onmousemove = dibujar;
      canvas.onmouseup = terminar; canvas.onmouseleave = terminar;
      canvas.ontouchstart = empezar; canvas.ontouchmove = dibujar; canvas.ontouchend = terminar;
    }

    document.getElementById('btnLimpiarFirma').addEventListener('click', () => {
      const canvas = document.getElementById('canvasFirma');
      firmaCtx?.clearRect(0, 0, canvas.width, canvas.height);
      firmaTieneTrazo = false;
      document.getElementById('btnConfirmarEntregaFinal').classList.add('urgente--pulso');
    });

    document.getElementById('btnTomarFotoEntrega').addEventListener('click', () => {
      document.getElementById('inputFotoEntrega').click();
    });
    document.getElementById('inputFotoEntrega').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { alert('La foto no puede superar 8MB'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        fotoEntregaBase64 = reader.result;
        const preview = document.getElementById('previewFotoEntrega');
        preview.src = fotoEntregaBase64;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnCancelarEntrega').addEventListener('click', () => {
      document.getElementById('overlayEntrega').classList.remove('show');
    });

    async function subirImagenEntrega(dataUrl, tipo, token) {
      const r = await fetch('/api/chofer/entrega-foto', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body: JSON.stringify({ imagen_base64: dataUrl, tipo }),
      });
      const data = await r.json();
      if (!r.ok) throw new Error(data.error || `Error al subir la ${tipo}`);
      return data.url;
    }

    document.getElementById('btnConfirmarEntregaFinal').addEventListener('click', async () => {
      const btn = document.getElementById('btnConfirmarEntregaFinal');
      const alerta = document.getElementById('alertaEntrega');
      alerta.style.display = 'none';

      if (!firmaTieneTrazo) {
        alerta.className = 'alerta alerta-err';
        alerta.textContent = 'Falta la firma de quien recibe.';
        alerta.style.display = 'block';
        return;
      }

      const cobroMontoRaw = document.getElementById('cobroMonto').value.trim();
      const cobroMedio    = document.getElementById('cobroMedio').value;
      let cobro = null;
      if (cobroMontoRaw) {
        const monto = parseFloat(cobroMontoRaw);
        if (!monto || monto <= 0) {
          alerta.className = 'alerta alerta-err';
          alerta.textContent = 'El monto cobrado tiene que ser mayor a cero.';
          alerta.style.display = 'block';
          return;
        }
        if (!cobroMedio) {
          alerta.className = 'alerta alerta-err';
          alerta.textContent = 'Seleccioná el medio de pago del cobro.';
          alerta.style.display = 'block';
          return;
        }
        cobro = { monto, medio: cobroMedio };
      }

      // FIX (Matías): antes el chofer podía cobrar de menos y confirmar la
      // entrega sin ningún aviso — el admin recién se enteraba mirando
      // Historial o el detalle de la entrega. Ahora, si el monto cobrado es
      // menor al total del pedido, se lo confirmamos explícitamente antes
      // de mandar el PATCH, para que quede claro que fue una decisión y no
      // un descuido.
      if (cobro && remitoActual?.total != null) {
        const diferencia = remitoActual.total - cobro.monto;
        if (diferencia > 0.5) {
          const confirmado = window.confirm(
            `Vas a cobrar ${formatPeso(cobro.monto)}, pero el total del pedido es ${formatPeso(remitoActual.total)} ` +
            `(faltan ${formatPeso(diferencia)}).\n\n¿Confirmás que entregaste igual con ese cobro?`
          );
          if (!confirmado) return;
        }
      }

      btn.disabled = true; btn.textContent = 'Confirmando...';

      const canvas = document.getElementById('canvasFirma');
      const firmaDataUrl = canvas.toDataURL('image/png');
      const receptor = document.getElementById('receptorEntrega').value.trim();
      const notas_entrega = document.getElementById('notasEntrega').value.trim();

      try {
        const token = await getToken();
        const firma_url = await subirImagenEntrega(firmaDataUrl, 'firma', token);

        let foto_url = null;
        if (fotoEntregaBase64) {
          foto_url = await subirImagenEntrega(fotoEntregaBase64, 'foto', token);
        }

        const r = await fetch(`/api/chofer/remitos/${pedidoId}/entregar`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ id: pedidoId, firma_url, foto_url, receptor: receptor || null, notas_entrega: notas_entrega || null, cobro }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al confirmar entrega');

        document.getElementById('overlayEntrega').classList.remove('show');
        await cargarRemito();
      } catch (e) {
        // Plan offline — Etapa 3: si se cortó la red en cualquier punto
        // (subida de firma/foto o el PATCH final) encolamos todo el
        // formulario tal cual quedó y lo reintentamos solos al reconectar,
        // en vez de hacerle perder al chofer la firma que ya tomó.
        if (esErrorDeRed(e) && window.ChoferOffline) {
          try {
            await window.ChoferOffline.encolarAccion('entregar', {
              pedido_id: pedidoId,
              firma_data_url: firmaDataUrl,
              foto_data_url: fotoEntregaBase64,
              receptor: receptor || null,
              notas_entrega: notas_entrega || null,
              cobro,
            });
            document.getElementById('overlayEntrega').classList.remove('show');
            alert('Sin conexión: guardamos la entrega en el celular y se va a enviar sola cuando vuelva el internet.');
            await cargarRemito().catch(() => {});
          } catch (e2) {
            alerta.className = 'alerta alerta-err';
            alerta.textContent = 'No se pudo guardar la entrega para enviar después: ' + e2.message;
            alerta.style.display = 'block';
          }
        } else {
          alerta.className = 'alerta alerta-err';
          alerta.textContent = e.message;
          alerta.style.display = 'block';
        }
      } finally {
        btn.disabled = false; btn.textContent = 'Confirmar entrega';
      }
    });

    // ── No se pudo entregar ──────────────────────────────────────────────
    // FIX (auditoría etapa 6 — Hallazgo 1): pega contra
    // PATCH /api/chofer/remitos/:id/no-entregar (nuevo endpoint autenticado
    // en pedidos.js). El pedido queda en 'confirmado' del lado del backend,
    // listo para reprogramarse en una próxima ruta.
    let fotoNoEntregaBase64 = null;

    function abrirModalNoEntrega() {
      fotoNoEntregaBase64 = null;
      document.getElementById('alertaNoEntrega').style.display = 'none';
      document.getElementById('motivoNoEntrega').value = 'nadie_en_casa';
      document.getElementById('notasNoEntrega').value = '';
      document.getElementById('previewFotoNoEntrega').style.display = 'none';
      document.getElementById('overlayNoEntrega').classList.add('show');
    }

    document.getElementById('btnCancelarNoEntrega').addEventListener('click', () => {
      document.getElementById('overlayNoEntrega').classList.remove('show');
    });

    document.getElementById('btnTomarFotoNoEntrega').addEventListener('click', () => {
      document.getElementById('inputFotoNoEntrega').click();
    });
    document.getElementById('inputFotoNoEntrega').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { alert('La foto no puede superar 8MB'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        fotoNoEntregaBase64 = reader.result;
        const preview = document.getElementById('previewFotoNoEntrega');
        preview.src = fotoNoEntregaBase64;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnConfirmarNoEntrega').addEventListener('click', async () => {
      const btn = document.getElementById('btnConfirmarNoEntrega');
      const alerta = document.getElementById('alertaNoEntrega');
      alerta.style.display = 'none';

      const motivo = document.getElementById('motivoNoEntrega').value;
      const notas = document.getElementById('notasNoEntrega').value.trim();

      btn.disabled = true; btn.textContent = 'Confirmando...';
      try {
        const token = await getToken();

        let foto_url = null;
        if (fotoNoEntregaBase64) {
          foto_url = await subirImagenEntrega(fotoNoEntregaBase64, 'foto', token);
        }

        const r = await fetch(`/api/chofer/remitos/${pedidoId}/no-entregar`, {
          method: 'PATCH',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ id: pedidoId, motivo, notas: notas || null, foto_url }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al registrar la no entrega');

        document.getElementById('overlayNoEntrega').classList.remove('show');
        await cargarRemito();
      } catch (e) {
        if (esErrorDeRed(e) && window.ChoferOffline) {
          try {
            await window.ChoferOffline.encolarAccion('no_entregar', {
              pedido_id: pedidoId,
              motivo,
              notas: notas || null,
              foto_data_url: fotoNoEntregaBase64,
            });
            document.getElementById('overlayNoEntrega').classList.remove('show');
            alert('Sin conexión: guardamos la no entrega en el celular y se va a enviar sola cuando vuelva el internet.');
            await cargarRemito().catch(() => {});
          } catch (e2) {
            alerta.className = 'alerta alerta-err';
            alerta.textContent = 'No se pudo guardar la no entrega para enviar después: ' + e2.message;
            alerta.style.display = 'block';
          }
        } else {
          alerta.className = 'alerta alerta-err';
          alerta.textContent = e.message;
          alerta.style.display = 'block';
        }
      } finally {
        btn.disabled = false; btn.textContent = 'Confirmar no entrega';
      }
    });

    // ── Devolución ─────────────────────────────────────────────────────────
    function abrirModalDevolucion() {
      fotoBase64 = null;
      document.getElementById('alertaDevolucion').style.display = 'none';
      document.getElementById('notasDevolucion').value = '';
      document.getElementById('previewFoto').style.display = 'none';
      document.getElementById('motivoDevolucion').value = 'producto_defectuoso';

      const items = remitoActual?.pedido_items || [];
      document.getElementById('listaItemsDevolucion').innerHTML = items.map(it => `
        <div class="item-devol">
          <input type="checkbox" class="chk-item" data-producto="${it.productos?.id}" data-precio="${it.precio_unitario}">
          <label>${esc(it.productos?.nombre || 'Producto')}</label>
          <input type="number" class="cant-item" min="1" max="${it.cantidad}" value="1" data-max="${it.cantidad}">
        </div>`).join('');

      document.getElementById('overlayDevolucion').classList.add('show');
    }

    document.getElementById('btnCancelarDevolucion').addEventListener('click', () => {
      document.getElementById('overlayDevolucion').classList.remove('show');
    });

    document.getElementById('btnTomarFoto').addEventListener('click', () => {
      document.getElementById('inputFoto').click();
    });

    document.getElementById('inputFoto').addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 8 * 1024 * 1024) { mostrarAlertaDevolucion('La imagen no puede superar 8MB'); return; }
      const reader = new FileReader();
      reader.onload = () => {
        fotoBase64 = reader.result;
        const preview = document.getElementById('previewFoto');
        preview.src = fotoBase64;
        preview.style.display = 'block';
      };
      reader.readAsDataURL(file);
    });

    document.getElementById('btnConfirmarDevolucion').addEventListener('click', async () => {
      const btn = document.getElementById('btnConfirmarDevolucion');
      const motivo = document.getElementById('motivoDevolucion').value;
      const notas = document.getElementById('notasDevolucion').value.trim();

      const items = [...document.querySelectorAll('.chk-item:checked')].map(chk => {
        const fila = chk.closest('.item-devol');
        const cantInput = fila.querySelector('.cant-item');
        return {
          producto_id: chk.dataset.producto,
          cantidad: Math.min(parseInt(cantInput.value) || 1, parseInt(cantInput.dataset.max) || 1),
          precio_unitario: parseFloat(chk.dataset.precio) || 0,
        };
      });

      if (!items.length) { mostrarAlertaDevolucion('Seleccioná al menos un producto'); return; }

      btn.disabled = true; btn.textContent = 'Enviando...';
      try {
        const token = await getToken();
        let foto_url = null;

        if (fotoBase64) {
          const rf = await fetch('/api/chofer/devolucion-foto', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
            body: JSON.stringify({ foto_base64: fotoBase64 }),
          });
          const df = await rf.json();
          if (!rf.ok) throw new Error(df.error || 'Error al subir la foto');
          foto_url = df.foto_url;
        }

        const r = await fetch('/api/chofer/devolucion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
          body: JSON.stringify({ pedido_id: pedidoId, motivo, notas: notas || null, foto_url, items }),
        });
        const data = await r.json();
        if (!r.ok) throw new Error(data.error || 'Error al registrar la devolución');

        document.getElementById('overlayDevolucion').classList.remove('show');
        alert('Devolución registrada correctamente.');
      } catch (e) {
        if (esErrorDeRed(e) && window.ChoferOffline) {
          try {
            await window.ChoferOffline.encolarAccion('devolucion', {
              pedido_id: pedidoId,
              motivo,
              notas: notas || null,
              foto_data_url: fotoBase64,
              items,
            });
            document.getElementById('overlayDevolucion').classList.remove('show');
            alert('Sin conexión: guardamos la devolución en el celular y se va a enviar sola cuando vuelva el internet.');
          } catch (e2) {
            mostrarAlertaDevolucion('No se pudo guardar la devolución para enviar después: ' + e2.message);
          }
        } else {
          mostrarAlertaDevolucion(e.message);
        }
      } finally {
        btn.disabled = false; btn.textContent = 'Confirmar devolución';
      }
    });

    function mostrarAlertaDevolucion(msg) {
      const el = document.getElementById('alertaDevolucion');
      el.className = 'alerta alerta-err';
      el.textContent = msg;
      el.style.display = 'block';
    }

    function formatPeso(n) {
      return new Intl.NumberFormat('es-AR', { style: 'currency', currency: 'ARS', maximumFractionDigits: 0 }).format(Number(n) || 0);
    }
    function esc(s) {
      return String(s ?? '').replace(/[&<>"']/g, c => ({ '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;' }[c]));
    }
  </script>
  <script src="/chofer/pwa-init.js"></script>
  <script src="/frontend/shared/chat-widget.js" defer data-chat-asistente="1"></script>
</body>
