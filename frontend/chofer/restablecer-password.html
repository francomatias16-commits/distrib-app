<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Restablecer contraseña — App Chofer</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,400;0,14..32,500;0,14..32,600;0,14..32,700;0,14..32,800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/shared/tokens.css?v=196" />
  <meta name="theme-color" content="#F5F2EA" />
  <script src="/frontend/env-config.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --login-bg-1: #F0F7FD;
      --login-bg-2: #DCEAF9;
      --login-bg-3: #C3DDF5;
      --login-card-bg: rgba(255,255,255,.58);
      --login-card-border: rgba(255,255,255,.85);
      --login-accent: #2E6DB4;
      --login-accent-dark: #1B4E85;
      --login-text: #1B3A5C;
      --login-text-light: #5C7699;
      --login-border: #C7DDF3;
    }

    body {
      font-family: 'Inter', sans-serif;
      font-size: 17px;
      min-height: 100vh;
      display: flex; align-items: center; justify-content: center; padding: 1.5rem;
      color: var(--login-text);
      background: linear-gradient(135deg, var(--login-bg-1) 0%, var(--login-bg-2) 55%, var(--login-bg-3) 100%);
    }

    .login-card {
      position: relative;
      background: var(--login-card-bg);
      backdrop-filter: blur(20px) saturate(140%);
      -webkit-backdrop-filter: blur(20px) saturate(140%);
      border: 1px solid var(--login-card-border);
      width: 100%; max-width: 440px; border-radius: 24px;
      box-shadow:
        0 24px 60px rgba(27,58,92,.16),
        0 2px 8px rgba(46,109,180,.08),
        inset 0 1px 0 rgba(255,255,255,.6);
      padding: 4.25rem 2.75rem 2.25rem;
      display: flex; flex-direction: column; align-items: center;
      overflow: visible;
    }

    .login-header { text-align: center; }
    .login-header .icon {
      position: absolute;
      top: -50px; left: 50%; transform: translateX(-50%);
      width: 100px; height: 100px; border-radius: 50%;
      background: rgba(255,255,255,.7);
      border: 2px solid var(--login-accent);
      box-shadow: 0 8px 20px rgba(27,58,92,.2);
      display: flex; align-items: center; justify-content: center; margin: 0 auto;
    }
    .login-header .icon svg {
      width: 46px; height: 46px; display: block;
      fill: none; stroke: var(--login-accent-dark);
      stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round;
    }
    .login-header h1 {
      font-family: var(--font-family-display);
      font-size: 1.9rem; font-weight: 700; color: var(--login-text);
    }
    .login-header p { font-size: .98rem; color: var(--login-text-light); margin-top: .3rem; }

    .login-body { width: 100%; margin-top: 2rem; }

    .field-wrap {
      position: relative;
      display: flex; align-items: center; gap: .7rem;
      border-bottom: 1.5px solid var(--login-border);
      padding: .65rem .1rem;
      transition: border-color .15s;
    }
    .field-wrap + .field-wrap { margin-top: 1rem; }
    .field-wrap:focus-within { border-color: var(--login-accent); }
    .field-wrap svg { color: var(--login-text-light); flex-shrink: 0; width: 20px; height: 20px; }
    .field-wrap:focus-within svg { color: var(--login-accent); }

    .field-wrap input {
      flex: 1; min-width: 0; width: 100%;
      border: none; background: transparent; padding: 0;
      font-size: 1.05rem; font-family: inherit; outline: none; color: var(--login-text);
    }
    .field-wrap input::placeholder { color: var(--login-text-light); font-style: italic; }

    .btn {
      width: 100%; padding: .95rem; border-radius: 9999px;
      font-size: .9rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase;
      cursor: pointer; margin-top: 1.75rem; font-family: inherit;
      transition: background .15s, color .15s, box-shadow .15s, transform .15s;
    }
    .btn-primary {
      background: transparent;
      color: var(--login-accent-dark);
      border: 1.5px solid var(--login-accent);
    }
    .btn-primary:hover {
      background: var(--login-accent);
      color: #fff;
      box-shadow: 0 12px 26px rgba(46,109,180,.3);
      transform: translateY(-1px);
    }
    .btn-primary:active { transform: translateY(0); filter: brightness(.98); }
    .btn:disabled { opacity: .6; cursor: not-allowed; transform: none; }

    .alerta {
      width: 100%;
      border-radius: 8px; padding: .75rem .95rem; font-size: .92rem; margin-bottom: 1rem; display: none;
    }
    .alerta-err { background: var(--color-danger-bg); color: var(--color-danger); border: 1px solid rgba(122,30,25,.2); }

    .link-a-login {
      display: none; text-align: center; margin-top: 16px; font-size: .85rem;
      color: var(--login-accent-dark); font-weight: 600; text-decoration: none;
    }
  </style>
  <link rel="stylesheet" href="/shared/reskin-patch.css?v=197" />
  <link rel="stylesheet" href="/shared/reskin-patch-v2-shadcn.css?v=197" />
  <link rel="stylesheet" href="/shared/responsive-mobile.css?v=699" />
  <script src="/shared/responsive-mobile.js?v=699" defer></script>
  <link rel="stylesheet" href="/shared/microinteracciones.css?v=1" />
  <link rel="stylesheet" href="/shared/a11y-focus.css?v=1" />
</head>
<body>
  <div class="login-card">
    <div class="login-header">
      <div class="icon">
        <svg viewBox="0 0 24 24">
          <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
          <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
        </svg>
      </div>
      <h1>Elegí tu contraseña</h1>
      <p id="subheading">Nueva contraseña para tu cuenta</p>
    </div>

    <div class="login-body">
      <div id="alertaError" class="alerta alerta-err"></div>

      <div id="formNuevaPass">
        <div class="field-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="passNueva" placeholder="Contraseña nueva (mín. 8 caracteres)" aria-label="Contraseña nueva" autocomplete="new-password">
        </div>
        <div class="field-wrap">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="passConfirmar" placeholder="Repetí la contraseña" aria-label="Confirmar contraseña" autocomplete="new-password">
        </div>

        <button type="button" class="btn btn-primary" id="btnGuardar" onclick="guardarPassword()">Guardar contraseña</button>
      </div>

      <a href="/chofer/login" id="linkALogin" class="link-a-login">Ir a iniciar sesión</a>
    </div>
  </div>

  <script>
    const sb = supabase.createClient(window.ENV.SUPABASE_URL, window.ENV.SUPABASE_ANON_KEY, { auth: { storageKey: 'sb-chofer-auth' } });
    let sesionRecuperacionLista = false;

    document.addEventListener('DOMContentLoaded', async () => {
      // supabase-js parsea automáticamente el token de recuperación del
      // link del mail y arma una sesión temporal solo para cambiar la
      // contraseña. Sin token válido (link vencido/ya usado), bloqueamos.
      const { data: { session } } = await sb.auth.getSession();

      if (!session) {
        bloquearFormulario('Este link no es válido o ya venció. Volvé al login y pedí uno nuevo desde "¿Olvidaste tu contraseña?".');
        return;
      }

      sesionRecuperacionLista = true;

      document.getElementById('passNueva').addEventListener('keydown', e => {
        if (e.key === 'Enter') document.getElementById('passConfirmar').focus();
      });
      document.getElementById('passConfirmar').addEventListener('keydown', e => {
        if (e.key === 'Enter') guardarPassword();
      });
    });

    function bloquearFormulario(msg) {
      document.getElementById('formNuevaPass').style.display = 'none';
      document.getElementById('subheading').textContent = 'Link no disponible';
      mostrarError(msg);
      const link = document.getElementById('linkALogin');
      link.style.display = 'block';
      link.textContent = 'Volver al login';
    }

    async function guardarPassword() {
      if (!sesionRecuperacionLista) return;

      const pass = document.getElementById('passNueva').value;
      const confirmar = document.getElementById('passConfirmar').value;
      document.getElementById('alertaError').style.display = 'none';

      if (!pass || pass.length < 8) {
        mostrarError('La contraseña debe tener al menos 8 caracteres.');
        return;
      }
      if (pass !== confirmar) {
        mostrarError('Las contraseñas no coinciden.');
        return;
      }

      const btn = document.getElementById('btnGuardar');
      btn.disabled = true;
      btn.textContent = 'Guardando...';

      try {
        const { error } = await sb.auth.updateUser({ password: pass });
        if (error) {
          mostrarError('No se pudo actualizar la contraseña. Probá pedir un link nuevo.');
          return;
        }

        await sb.auth.signOut();
        window.location.href = '/chofer/login?reset=ok';

      } catch {
        mostrarError('Error de conexión. Intentá de nuevo.');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Guardar contraseña';
      }
    }

    function mostrarError(msg) {
      document.getElementById('alertaError').textContent = msg;
      document.getElementById('alertaError').style.display = 'block';
    }
  </script>
</body>
</html>
