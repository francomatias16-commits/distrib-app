name: Restaurar a proyecto de prueba (manual)

on:
  workflow_dispatch: {}   # se corre a mano desde la pestaña Actions

jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar cliente de PostgreSQL 17
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl ca-certificates gnupg
          curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc | \
            sudo gpg --dearmor -o /usr/share/keyrings/postgresql-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/postgresql-keyring.gpg] http://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" | \
            sudo tee /etc/apt/sources.list.d/pgdg.list
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client-17
          echo "/usr/lib/postgresql/17/bin" >> "$GITHUB_PATH"

      # Arma las dos URLs (origen = prod, destino = proyecto de prueba)
      # con el mismo URL-encoding seguro que ya usa el backup workflow.
      - name: Construir URLs de conexión
        id: buildurl
        env:
          SRC_HOST: ${{ secrets.SUPABASE_DB_HOST }}
          SRC_PORT: ${{ secrets.SUPABASE_DB_PORT }}
          SRC_NAME: ${{ secrets.SUPABASE_DB_NAME }}
          SRC_USER: ${{ secrets.SUPABASE_DB_USER }}
          SRC_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          DST_HOST: ${{ secrets.SUPABASE_TEST_DB_HOST }}
          DST_PORT: ${{ secrets.SUPABASE_TEST_DB_PORT }}
          DST_NAME: ${{ secrets.SUPABASE_TEST_DB_NAME }}
          DST_USER: ${{ secrets.SUPABASE_TEST_DB_USER }}
          DST_PASSWORD: ${{ secrets.SUPABASE_TEST_DB_PASSWORD }}
        run: |
          read SRC_URL DST_URL <<< $(python3 - <<'EOF'
          import os, urllib.parse
          def build(prefix):
              user = urllib.parse.quote(os.environ[f"{prefix}_USER"], safe="")
              pwd  = urllib.parse.quote(os.environ[f"{prefix}_PASSWORD"], safe="")
              host = os.environ[f"{prefix}_HOST"]
              port = os.environ.get(f"{prefix}_PORT") or "5432"
              name = os.environ.get(f"{prefix}_NAME") or "postgres"
              return f"postgresql://{user}:{pwd}@{host}:{port}/{name}"
          print(build("SRC"), build("DST"))
          EOF
          )
          echo "::add-mask::$SRC_URL"
          echo "::add-mask::$DST_URL"
          echo "src_url=$SRC_URL" >> "$GITHUB_OUTPUT"
          echo "dst_url=$DST_URL" >> "$GITHUB_OUTPUT"

      # --- Fix del error "type extensions.vector does not exist" ---
      # Prod usa la extensión pgvector (instalada en el schema "extensions",
      # como hace Supabase por defecto) para algún tipo/columna. El dump con
      # --schema=public no incluye la creación de extensiones, así que si el
      # proyecto de prueba nunca la tuvo habilitada, el restore falla apenas
      # encuentra el tipo "vector". Se la habilita acá antes de restaurar
      # (si ya está habilitada, el IF NOT EXISTS no hace nada).
      - name: Asegurar extensiones necesarias en destino
        env:
          DST_URL: ${{ steps.buildurl.outputs.dst_url }}
        run: |
          psql "$DST_URL" -v ON_ERROR_STOP=1 -c "create extension if not exists vector with schema extensions;"

      # --- Fix definitivo: destino garantizado limpio en cada corrida ---
      # Los intentos fallidos anteriores dejaron el proyecto de prueba en
      # estados intermedios distintos cada vez (a veces con tipos de más,
      # a veces con tablas de menos) — por eso --clean/--if-exists seguía
      # rompiendo: un DROP TRIGGER/POLICY "IF EXISTS x ON tabla" falla
      # igual si la tabla en sí no existe, sin importar el IF EXISTS.
      # En vez de perseguir cada combinación posible de estado a medias,
      # se borra el schema public completo y se recrea vacío con los
      # permisos estándar de Supabase (anon/authenticated/service_role)
      # ANTES de restaurar. Así cada corrida parte de exactamente el mismo
      # punto de partida, sin importar cómo terminó la anterior.
      - name: Resetear schema public en destino (estado limpio garantizado)
        env:
          DST_URL: ${{ steps.buildurl.outputs.dst_url }}
        run: |
          psql "$DST_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DROP SCHEMA IF EXISTS public CASCADE;
          CREATE SCHEMA public;
          GRANT ALL ON SCHEMA public TO postgres;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON TABLES TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON FUNCTIONS TO postgres, anon, authenticated, service_role;
          ALTER DEFAULT PRIVILEGES IN SCHEMA public GRANT ALL ON SEQUENCES TO postgres, anon, authenticated, service_role;
          SQL

      # El schema ya quedó vacío por el paso anterior, así que ya no hace
      # falta --clean/--if-exists: no hay nada previo con qué chocar.
      - name: Dump de prod → restore directo al proyecto de prueba
        env:
          SRC_URL: ${{ steps.buildurl.outputs.src_url }}
          DST_URL: ${{ steps.buildurl.outputs.dst_url }}
        run: |
          pg_dump "$SRC_URL" \
            --schema=public \
            --no-owner \
            --no-privileges \
          | sed -e '/^CREATE SCHEMA public;/d' \
                -e '/^COMMENT ON SCHEMA public IS/d' \
          | psql "$DST_URL" -v ON_ERROR_STOP=1

      - name: Chequeo de integridad (conteo de filas por tabla)
        env:
          SRC_URL: ${{ steps.buildurl.outputs.src_url }}
          DST_URL: ${{ steps.buildurl.outputs.dst_url }}
        run: |
          echo "== PROD =="
          psql "$SRC_URL" -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname;"
          echo "== TEST =="
          psql "$DST_URL" -c "SELECT relname, n_live_tup FROM pg_stat_user_tables ORDER BY relname;"
