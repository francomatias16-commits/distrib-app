name: AI Review (informativo)

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

# Necesario para poder postear/actualizar comentarios en el PR.
permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ai-review:
    name: reviewer IA (Gemini free tier)
    runs-on: ubuntu-latest
    # No bloquea el merge: cualquier falla del job se ve en la pestaña
    # Actions pero no cuenta como check requerido (no lo sumes a
    # branch protection todavía — ver Fase 1 del plan).
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 24.x
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Revisión IA del diff del PR
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # Opcional: cambiar de modelo sin tocar el script.
          # GEMINI_MODEL: gemini-2.0-flash
        run: node scripts/ai-review-pr.js
